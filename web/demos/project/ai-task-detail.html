<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 任务详情 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/ux.css">
<style>
  /* 弹层、折叠体与场景面板靠 hidden 开关，作者样式的 display 会盖过 UA [hidden] */
  [hidden] { display: none !important; }

  /* 静态稿用场景切换演示类型策略分发，实际页面由任务状态与类型驱动 */
  .scene-switcher { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; padding: 8px 12px; background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: var(--radius-md); }
  .task-breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: var(--font-size-sm); }
  .task-breadcrumb__sep { color: var(--n-400); }
  .task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .task-head__title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .task-head__title { margin: 0; color: var(--n-900); font-size: var(--font-size-2xl); font-weight: 650; }
  .task-head__meta { margin: 6px 0 0; color: var(--n-500); font-size: var(--font-size-sm); }
  .task-head__actions { display: flex; gap: 8px; flex-shrink: 0; }
  .assistant-entry { display: flex; align-items: center; gap: 4px; margin: -6px 0 14px; color: var(--n-500); font-size: var(--font-size-xs); }
  .task-section { margin-bottom: 16px; }

  .review-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .review-head__main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .section-title { margin: 0; color: var(--n-900); font-size: var(--font-size-lg); font-weight: 650; }

  .review-card__body { min-height: 72px; color: var(--n-700); font-size: var(--font-size-sm); line-height: 1.6; }
  .review-card__body p { margin: 8px 0; }
  .review-fields { margin: 8px 0; }
  .review-field { display: flex; gap: 12px; padding: 4px 0; }
  .review-field dt { flex: 0 0 96px; color: var(--n-500); }
  .review-field dd { flex: 1; margin: 0; }
  .review-sources { padding-top: 8px; border-top: 1px solid var(--n-200); }
  .review-source { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 0; }
  .review-source__title { color: var(--n-900); font-weight: 600; }
  .review-source__quote { color: var(--n-500); }

  .compare-view { margin: 8px 0 12px; }
  .compare-head, .compare-row { display: grid; grid-template-columns: minmax(72px, 1fr) minmax(0, 2fr) minmax(0, 2fr); column-gap: 8px; }
  .compare-head { font-size: var(--font-size-xs); color: var(--n-500); }
  .compare-head span:last-child { color: var(--brand-500); }
  .compare-row { padding: 4px 0; border-bottom: 1px solid var(--n-200); font-size: var(--font-size-sm); word-break: break-word; }
  .compare-row--changed { padding-left: 8px; background: var(--st-success-light); box-shadow: inset 3px 0 0 var(--st-success); }
  .compare-row__label { color: var(--n-500); font-weight: 600; }
  .compare-row__existing { color: var(--n-500); }
  .compare-fold { margin-top: 4px; }

  .case-steps { margin: 8px 0; padding-left: 20px; }
  .case-step { margin-bottom: 4px; }

  .collapse-item { border-bottom: 1px solid var(--n-200); }
  .collapse-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; padding: 10px 0; background: none; border: none; cursor: pointer; font-size: var(--font-size-sm); text-align: left; }
  .collapse-head__kind { color: var(--n-500); font-size: var(--font-size-xs); }
  .collapse-head__name { flex: 1; min-width: 160px; overflow: hidden; color: var(--n-900); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .collapse-head__note { margin-left: auto; color: var(--n-500); }
  .collapse-body { padding: 4px 0 14px; }
  .collapse-body__loading { color: var(--n-500); font-size: var(--font-size-sm); }

</style>
</head>
<body data-shell="business" data-mode="project" data-active="ft" data-workspace="质量中台" data-project="电商核心系统">

<main class="content content--flush">
  <div class="split">
    <aside class="split__side" data-side="ft"></aside>

    <div class="split__main">
      <nav class="task-breadcrumb" aria-label="面包屑">
        <a href="ai-task-center.html">AI 任务中心</a>
        <span class="task-breadcrumb__sep" aria-hidden="true">›</span>
        <span class="task-breadcrumb__current" id="dt-breadcrumb">任务详情</span>
      </nav>

      <div class="scene-switcher">
        <span class="muted">演示场景</span>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="import">需求导入 · 待采纳</button>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="readonly">用例优化 · 待采纳</button>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="plan">计划排序 · 待采纳</button>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="running">执行中</button>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="aborted">已终止</button>
        <button class="btn btn--default btn--sm" type="button" data-scene-btn="closed">已结束 · 只读回看</button>
      </div>

      <header class="task-head">
        <div>
          <div class="task-head__title-row">
            <h1 class="task-head__title" id="dt-title">任务详情</h1>
            <span class="tag tag--sm" id="dt-status">待采纳</span>
            <span class="tag tag--sm" id="dt-adoption" hidden>部分采纳</span>
          </div>
          <p class="task-head__meta" id="dt-meta">类型 — · 发起人 — · 发起时间 —</p>
        </div>
        <div class="task-head__actions" id="dt-actions"></div>
      </header>

      <div class="assistant-entry"><span data-icon="sparkle"></span><span>AI 助手入口示意：</span><a href="ai-task-center.html">前往 AI 任务中心</a></div>

      <section class="card task-section" id="dt-execution">
        <div class="card__header"><span class="card__title">执行</span><span class="card__subtitle" id="dt-exec-seq">第 1 次执行</span></div>
        <div class="card__body">
          <div class="flex-center flex-gap-md">
            <span class="tag tag--sm" id="dt-exec-status">已成功</span>
            <span class="muted" id="dt-exec-metric">已完成 8 / 8 步 · 预算消耗 80%</span>
          </div>
          <div class="progress" style="margin-top:10px">
            <div class="progress__track"><div class="progress__fill" id="dt-exec-fill" style="width:100%"></div></div>
            <span class="progress__text" id="dt-exec-percent">100%</span>
          </div>
          <div class="alert alert--danger" id="dt-terminate" style="margin-top:10px" hidden></div>
          <p class="muted" id="dt-poll-note" style="margin:10px 0 0" hidden></p>
        </div>
      </section>

      <section class="card task-section" id="dt-plan-section">
        <div class="card__header"><span class="card__title">计划步骤</span></div>
        <div class="card__body"><ol class="timeline" id="dt-plan-list"></ol></div>
      </section>

      <section class="card task-section" id="dt-trace-section">
        <div class="card__header"><span class="card__title">执行轨迹</span></div>
        <div class="card__body"><ol class="timeline" id="dt-trace-list"></ol></div>
      </section>

      <section class="card task-section" id="dt-proposal-section" hidden>
        <div class="card__body adoption-result">
          <header class="review-head">
            <div class="review-head__main">
              <h2 class="section-title">提案与审核结果</h2>
              <span class="tag tag--sm" id="dt-proposal-result" hidden>部分采纳</span>
            </div>
            <div class="review-head__main">
              <button class="btn btn--link btn--sm" type="button" id="dt-proposal-prev">上一个</button>
              <span class="muted" id="dt-proposal-pos"></span>
              <button class="btn btn--link btn--sm" type="button" id="dt-proposal-next">下一个</button>
            </div>
          </header>
          <p class="muted" id="dt-proposal-hint" style="margin:0 0 12px">只读查看提案产物与审核结果，不提供审核操作</p>
          <div class="review-card" id="dt-proposal-card">
            <div class="review-head" style="margin-bottom:8px">
              <div class="review-head__main">
                <span class="muted" id="dt-proposal-kind"></span>
                <strong id="dt-proposal-title"></strong>
                <span class="tag tag--sm" id="dt-proposal-status"></span>
              </div>
            </div>
            <p class="muted" id="dt-proposal-note" hidden></p>
            <div class="review-card__body" id="dt-proposal-detail"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<div class="dialog-mask" id="dt-confirm-dialog" data-mask-close hidden>
  <div class="dialog" style="width:420px">
    <div class="dialog__header"><span class="dialog__title" id="dt-confirm-title">确认终止执行</span><button class="dialog__close" data-close="dt-confirm-dialog" aria-label="关闭"><span data-icon="x"></span></button></div>
    <div class="dialog__body"><p id="dt-confirm-body" style="margin:0;color:var(--n-600)"></p></div>
    <div class="dialog__footer">
      <button class="btn btn--default" type="button" data-close="dt-confirm-dialog">取消</button>
      <button class="btn btn--danger" type="button" id="dt-confirm-ok">确认</button>
    </div>
  </div>
</div>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/ux.js"></script>
<script>
(function () {
  function byId(id) { return document.getElementById(id); }
  function esc(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var currentScene = 'import';
  var proposalIndex = 0;

  function renderProposal() {
    var scene = scenes[currentScene] || scenes.import;
    var proposals = scene.proposals || [];
    var section = byId('dt-proposal-section');
    if (!proposals.length) { section.hidden = true; return; }
    section.hidden = false;
    if (proposalIndex < 0) proposalIndex = 0;
    if (proposalIndex >= proposals.length) proposalIndex = proposals.length - 1;
    var item = proposals[proposalIndex];
    byId('dt-proposal-pos').textContent = '第 ' + (proposalIndex + 1) + ' / ' + proposals.length + ' 条';
    byId('dt-proposal-prev').disabled = proposalIndex === 0;
    byId('dt-proposal-next').disabled = proposalIndex === proposals.length - 1;
    byId('dt-proposal-kind').textContent = item.kind;
    byId('dt-proposal-title').textContent = item.title;
    var status = byId('dt-proposal-status');
    status.className = 'tag tag--sm ' + item.tag;
    status.textContent = item.status;
    var note = byId('dt-proposal-note');
    note.hidden = !item.note;
    note.textContent = item.note || '';
    byId('dt-proposal-detail').innerHTML = item.detail;
  }

  var scenes = {
    import: {
      title: '优惠券规则需求文档导入', status: '待采纳', statusTag: 'tag--warning', adoption: '待采纳',
      meta: '类型 需求导入（需求） · 发起人 陈晓 · 发起时间 2026-11-20 10:12',
      exec: '已成功', execTag: 'tag--success', steps: 8, max: 8, seq: 1,
      terminate: '', poll: '任务处于待采纳，详情页已停止轮询；提案处置在需求管理页完成',
      plan: [['解析需求文档', 'done'], ['抽取候选需求', 'done'], ['生成需求建议', 'done'], ['等待人工确认', 'current']],
      trace: [['计划', '生成 4 步执行计划', '10:12:03'], ['AI 决策', '按段落拆分需求条目', '10:12:11'], ['工具调用', 'document.parse', '10:12:15'], ['产出提案', '需求建议 ×3', '10:12:22'], ['状态变更', 'running → proposals_ready', '10:12:23']],
      proposals: [
        { kind: '需求建议', title: '优惠券叠加规则', status: '待采纳', tag: 'tag--warning', note: '', detail: '<p>同一订单仅可使用一张优惠券，叠加规则写入需求描述。</p><dl class="review-fields"><div class="review-field"><dt>模块 ID</dt><dd>mod-coupon</dd></div><div class="review-field"><dt>优先级</dt><dd>高</dd></div></dl>' },
        { kind: '需求建议', title: '优惠券有效期说明', status: '待采纳', tag: 'tag--warning', note: '', detail: '<p>补充优惠券有效期、时区与过期提示说明。</p>' }
      ]
    },
    readonly: {
      title: '优惠券边界用例优化建议', status: '待采纳', statusTag: 'tag--warning', adoption: '',
      meta: '类型 用例优化（辅助） · 发起人 王芳 · 发起时间 2026-11-19 11:05',
      exec: '已成功', execTag: 'tag--success', steps: 6, max: 6, seq: 1,
      terminate: '', poll: '任务处于待采纳，详情页已停止轮询',
      plan: [['读取脑图节点', 'done'], ['生成节点优化建议', 'done'], ['输出结构化预览', 'done']],
      trace: [['计划', '生成 3 步执行计划', '11:05:02'], ['工具调用', 'mindmap.readNodes', '11:05:10'], ['产出提案', '用例优化 ×3', '11:05:18'], ['状态变更', 'running → proposals_ready', '11:05:19']]
    },
    plan: {
      title: '购物车结算执行顺序调整', status: '待采纳', statusTag: 'tag--warning', adoption: '',
      meta: '类型 计划排序（辅助） · 发起人 李华 · 发起时间 2026-11-19 17:32',
      exec: '已成功', execTag: 'tag--success', steps: 4, max: 4, seq: 1,
      terminate: '', poll: '任务处于待采纳，详情页已停止轮询',
      plan: [['读取计划节点', 'done'], ['评估前置依赖', 'done'], ['生成排序建议', 'done']],
      trace: [['计划', '生成 3 步执行计划', '17:32:04'], ['AI 决策', '按依赖调整执行顺序', '17:32:12'], ['产出提案', '排序建议 ×1', '17:32:20'], ['状态变更', 'running → proposals_ready', '17:32:21']]
    },
    running: {
      title: '支付回调幂等用例优化', status: '执行中', statusTag: 'tag--warning', adoption: '',
      meta: '类型 用例优化（辅助） · 发起人 李华 · 发起时间 2026-11-20 09:42',
      exec: '执行中', execTag: 'tag--warning', steps: 3, max: 5, seq: 2,
      terminate: '', poll: '',
      plan: [['读取脑图节点', 'done'], ['分析幂等边界', 'done'], ['生成节点优化建议', 'current'], ['写入提案清单', 'pending'], ['等待人工确认', 'pending']],
      trace: [['计划', '生成 5 步执行计划', '09:42:05'], ['AI 决策', '按回调链路分析边界', '09:42:14'], ['工具调用', 'mindmap.readNodes', '09:42:19'], ['工具结果', '返回 3 个用例节点', '09:42:20']]
    },
    aborted: {
      title: '向量索引重建（商品库）', status: '已终止', statusTag: 'tag--danger', adoption: '',
      meta: '类型 向量索引重建（底座） · 发起人 周敏 · 发起时间 2026-11-18 10:15',
      exec: '已终止', execTag: 'tag--danger', steps: 2, max: 6, seq: 1,
      terminate: '用户手动终止（错误码 1000018210）', poll: '任务已终止，详情页已停止轮询',
      plan: [['扫描向量集合', 'done'], ['重建商品索引', 'aborted'], ['校验索引版本', 'pending'], ['切换读别名', 'pending']],
      trace: [['计划', '生成 4 步执行计划', '10:15:02'], ['工具调用', 'vector.reindex', '10:15:13'], ['状态变更', 'running → aborted', '10:16:41']]
    },
    closed: {
      title: '需求文档 R-2026-118 导入', status: '已结束', statusTag: 'tag--neutral', adoption: '部分采纳',
      meta: '类型 需求导入（需求） · 发起人 陈晓 · 发起时间 2026-11-18 14:33 · 第 1 次执行',
      exec: '已成功', execTag: 'tag--success', steps: 8, max: 8, seq: 1,
      terminate: '', poll: '任务已结束，详情页已停止轮询',
      plan: [['解析需求文档', 'done'], ['抽取候选需求', 'done'], ['生成需求建议', 'done'], ['写入采纳结果', 'done']],
      trace: [['计划', '生成 4 步执行计划', '14:33:01'], ['产出提案', '需求建议 ×2 / 用例 ×1', '14:33:29'], ['状态变更', 'proposals_ready → closed', '14:41:12']],
      proposals: [
        { kind: '需求建议', title: '优惠券叠加规则', status: '已采纳', tag: 'tag--success', note: '备注：按建议补充叠加限制', detail: '<p>同一订单仅可使用一张优惠券，叠加规则写入需求描述。</p><dl class="review-fields"><div class="review-field"><dt>模块 ID</dt><dd>mod-coupon</dd></div><div class="review-field"><dt>优先级</dt><dd>高</dd></div></dl>' },
        { kind: '用例', title: '重复优惠叠加用例', status: '已驳回', tag: 'tag--neutral', note: '驳回原因：与既有 P0 用例重复', detail: '<p>模型建议新增的叠加边界用例与既有 P0 用例覆盖点一致。</p><div class="alert alert--warning">疑似与既有数据重复</div>' }
      ]
    }
  };

  function timelineHtml(items, kind) {
    var dotClass = { done: 'success', current: 'brand', aborted: 'danger', pending: '', info: '' };
    return items.map(function (item) {
      var label = kind === 'plan' ? item[0] : item[0];
      var body = kind === 'plan' ? '' : item[1];
      var time = kind === 'plan' ? '' : item[2];
      var state = kind === 'plan' ? item[1] : '';
      return '<li class="timeline__item"><span class="timeline__dot' + (dotClass[state] ? ' timeline__dot--' + dotClass[state] : '') + '"></span>' +
        '<div class="timeline__head"><span>' + esc(label) + '</span>' + (time ? '<span class="timeline__time">' + esc(time) + '</span>' : '') + '</div>' +
        (body ? '<div class="timeline__body">' + esc(body) + '</div>' : '') + '</li>';
    }).join('');
  }

  function setScene(name) {
    var scene = scenes[name] || scenes.import;
    byId('dt-title').textContent = scene.title;
    byId('dt-breadcrumb').textContent = scene.title;
    byId('dt-meta').textContent = scene.meta;
    var statusEl = byId('dt-status');
    statusEl.className = 'tag tag--sm ' + scene.statusTag;
    statusEl.textContent = scene.status;
    var adoptionEl = byId('dt-adoption');
    adoptionEl.hidden = !scene.adoption;
    if (scene.adoption) {
      adoptionEl.className = 'tag tag--sm tag--warning';
      adoptionEl.textContent = scene.adoption;
    }

    byId('dt-exec-seq').textContent = scene.seq > 1 ? '第 ' + scene.seq + ' 次执行' : '';
    var execStatus = byId('dt-exec-status');
    execStatus.className = 'tag tag--sm ' + scene.execTag;
    execStatus.textContent = scene.exec;
    byId('dt-exec-metric').textContent = '已完成 ' + scene.steps + ' / ' + scene.max + ' 步 · 预算消耗 ' + Math.round(scene.steps / scene.max * 100) + '%';
    var fill = byId('dt-exec-fill');
    fill.style.width = Math.round(scene.steps / scene.max * 100) + '%';
    fill.className = 'progress__fill' + (scene.exec === '执行中' ? ' progress__fill--brand' : scene.exec === '已终止' ? ' progress__fill--danger' : '');
    byId('dt-exec-percent').textContent = Math.round(scene.steps / scene.max * 100) + '%';
    var terminate = byId('dt-terminate');
    terminate.hidden = !scene.terminate;
    terminate.textContent = scene.terminate;
    var poll = byId('dt-poll-note');
    poll.hidden = !scene.poll;
    poll.textContent = scene.poll;

    byId('dt-plan-list').innerHTML = timelineHtml(scene.plan, 'plan');
    byId('dt-trace-list').innerHTML = timelineHtml(scene.trace, 'trace');

    byId('dt-plan-section').hidden = scene.plan.length === 0;
    byId('dt-trace-section').hidden = scene.trace.length === 0;

    document.querySelectorAll('[data-scene-btn]').forEach(function (btn) {
      btn.classList.toggle('btn--primary', btn.getAttribute('data-scene-btn') === name);
      btn.classList.toggle('btn--default', btn.getAttribute('data-scene-btn') !== name);
    });
    var proposalSection = byId('dt-proposal-section');
    var proposals = scene.proposals || [];
    proposalSection.hidden = proposals.length === 0;
    var proposalResult = byId('dt-proposal-result');
    proposalResult.hidden = !scene.adoption;
    if (scene.adoption) {
      proposalResult.className = 'tag tag--sm ' + (scene.adoption === '待采纳' ? 'tag--warning' : scene.adoption === '已采纳' ? 'tag--success' : 'tag--warning');
      proposalResult.textContent = scene.adoption;
    }
    byId('dt-proposal-hint').textContent = name === 'closed'
      ? '已结束任务逐条只读回看，不提供审核操作'
      : '只读查看提案产物与审核结果，实际处置在对应业务面板完成';
    currentScene = name;
    proposalIndex = 0;
    renderProposal();
    if (window.RTIcons && typeof window.RTIcons.replace === 'function') window.RTIcons.replace();

    byId('dt-actions').innerHTML = name === 'running'
      ? '<button class="btn btn--danger" type="button" data-page-op="abort">终止</button>'
      : name === 'aborted'
        ? '<button class="btn btn--primary" type="button" data-page-op="reexecute">再次执行</button>'
        : '';
  }

  var confirmAction = null;

  function askConfirm(title, body, okLabel, action) {
    byId('dt-confirm-title').textContent = title;
    byId('dt-confirm-body').textContent = body;
    byId('dt-confirm-ok').textContent = okLabel;
    confirmAction = action;
    byId('dt-confirm-dialog').hidden = false;
  }

  document.addEventListener('click', function (e) {
    var closer = e.target.closest('[data-close]');
    if (closer) { byId(closer.getAttribute('data-close')).hidden = true; return; }

    var fold = e.target.closest('[data-compare-fold]');
    if (fold) {
      var view = fold.closest('.compare-view');
      var hiddenRows = view.querySelectorAll('[data-unchanged]');
      var expanding = fold.textContent.indexOf('展开') === 0;
      hiddenRows.forEach(function (row) { row.hidden = !expanding; });
      fold.textContent = expanding ? '收起无变化项' : '展开其余 ' + hiddenRows.length + ' 项无变化内容';
      return;
    }

    if (e.target.closest('#dt-proposal-prev')) {
      proposalIndex -= 1;
      renderProposal();
      return;
    }
    if (e.target.closest('#dt-proposal-next')) {
      proposalIndex += 1;
      renderProposal();
      return;
    }

    var sceneBtn = e.target.closest('[data-scene-btn]');
    if (sceneBtn) { setScene(sceneBtn.getAttribute('data-scene-btn')); return; }

    var pageOp = e.target.closest('[data-page-op]');
    if (pageOp) {
      if (pageOp.getAttribute('data-page-op') === 'abort') {
        askConfirm('确认终止执行', '终止后本任务停止执行，不产生任何落库数据，可再次执行。', '终止执行', function () {
          byId('dt-confirm-dialog').hidden = true;
          setScene('aborted');
          window.RTUX.toast('执行已终止', { type: 'success' });
        });
      } else {
        askConfirm('再次执行', '将沿用同一任务新建一次执行实例。', '再次执行', function () {
          byId('dt-confirm-dialog').hidden = true;
          setScene('running');
          window.RTUX.toast('已发起再次执行', { type: 'success' });
        });
      }
      return;
    }
  });

  byId('dt-confirm-ok').addEventListener('click', function () {
    var action = confirmAction;
    confirmAction = null;
    if (action) action();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.dialog-mask').forEach(function (mask) { mask.hidden = true; });
  });
  document.querySelectorAll('[data-mask-close]').forEach(function (mask) {
    mask.addEventListener('click', function (e) { if (e.target === mask) mask.hidden = true; });
  });

  var params = new URLSearchParams(window.location.search);
  var initial = params.get('scene');
  setScene(scenes[initial] ? initial : 'import');
})();
</script>
</body>
</html>
