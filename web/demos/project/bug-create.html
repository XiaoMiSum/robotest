<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交缺陷 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .field__label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .field__label-row .field__label { margin-bottom: 0; }
  .field__count { font-size: var(--font-size-xs); color: var(--n-400); font-variant-numeric: tabular-nums; }

  /* 标题输入：大号输入 */
  .title-group { display: flex; align-items: stretch; }
  .title-input { height: 40px; font-size: var(--font-size-lg); border-radius: var(--radius-md); }

  .upload {
    border: 1.5px dashed var(--n-300); border-radius: var(--radius-lg);
    padding: 26px; text-align: center; color: var(--n-500); font-size: 13px;
    background: var(--n-25); cursor: pointer; transition: border-color var(--transition-fast);
  }
  .upload:hover { border-color: var(--brand-400); color: var(--brand-600); }
  .upload svg { width: 22px; height: 22px; display: block; margin: 0 auto 8px; }
  .upload em { font-style: normal; color: var(--brand-500); }
  .upload:hover em { color: var(--brand-600); }

  /* 顶栏：面包屑与提交操作同行，操作区复用 page-head__actions */
  .page-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    margin-bottom: var(--block-gap);
  }
  .page-topbar .breadcrumb { margin-bottom: 0; }
</style>
</head>
<body data-shell="business" data-mode="project" data-active="bugs" data-workspace="质量中台" data-project="电商核心系统">

<main class="content">

  <div class="page-topbar">
    <div class="breadcrumb">
      <a href="bugs.html">缺陷管理</a>
      <span data-icon="chevron-right"></span>
      <span>提交缺陷</span>
    </div>
    <div class="page-head__actions">
      <a class="btn btn--default" href="bugs.html">取消</a>
      <button class="btn btn--primary" type="button">提交缺陷</button>
    </div>
  </div>

  <div class="card-grid" style="grid-template-columns: minmax(0, 1fr) 320px; align-items:start">
    <div>
      <div class="card">
        <div class="card__body">
          <div class="field">
            <div class="field__label-row">
              <label class="field__label" for="f-title">标题<span class="req">*</span></label>
              <span class="field__count">17/300</span>
            </div>
            <div class="title-group">
              <input class="input title-input" id="f-title" maxlength="300"
                placeholder="用一句话描述缺陷现象"
                value="下单超时未释放库存，二次下单报缺货">
            </div>
          </div>

          <div class="field">
            <textarea class="textarea" id="f-steps" style="min-height:140px"
              aria-label="重现步骤" placeholder="重现步骤（支持 Markdown，可选）">## 重现步骤



## 期望结果

## 实际结果

</textarea>
          </div>

          <div class="field" style="margin-bottom:0">
            <label class="field__label">附件</label>
            <div class="upload">
              <span data-icon="upload"></span>
              将文件拖到此处，或<em>点击选择</em>
            </div>
            <div class="field__hint">单个文件不超过 10MB，创建后自动上传</div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card__body">
          <div class="field">
            <label class="field__label" for="f-type">缺陷类型<span class="req">*</span></label>
            <select class="select" id="f-type">
              <option selected>代码错误</option>
              <option>界面优化</option>
              <option>设计缺陷</option>
              <option>配置相关</option>
              <option>安装部署</option>
              <option>安全相关</option>
              <option>性能问题</option>
              <option>标准规范</option>
              <option>其他</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="f-module">所属模块</label>
            <select class="select" id="f-module">
              <option value="" selected disabled>选择所属模块（可选）</option>
              <option>下单流程</option>
              <option>支付中心</option>
              <option>履约配送</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="f-severity">严重等级<span class="req">*</span></label>
            <select class="select" id="f-severity">
              <option>致命</option>
              <option>严重</option>
              <option selected>一般</option>
              <option>轻微</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="f-priority">优先级<span class="req">*</span></label>
            <select class="select" id="f-priority">
              <option>高</option>
              <option selected>中</option>
              <option>低</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="f-due">截止日期</label>
            <input class="input" id="f-due" type="date" placeholder="选择截止日期（可选）">
          </div>

          <div class="field" style="margin-bottom:0">
            <label class="field__label" for="f-keywords">关键词</label>
            <input class="input" id="f-keywords" maxlength="255" placeholder="多个关键词用空格分隔（可选）">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__body">
          <div class="field">
            <label class="field__label" for="f-assignee">指派给<span class="req">*</span></label>
            <select class="select" id="f-assignee">
              <option value="" disabled>选择处理人</option>
              <option selected>张明（下单流程 Owner）</option>
              <option>李华（支付中心 Owner）</option>
              <option>周敏（营销优惠 Owner）</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label">关联用例</label>
            <div class="flex-center flex-gap-md">
              <button class="btn btn--default" type="button">选择用例</button>
              <span class="text-xs muted">已选 1 个用例</span>
            </div>
          </div>

          <div class="field" style="margin-bottom:0">
            <label class="field__label" for="f-plan">关联计划</label>
            <select class="select" id="f-plan">
              <option value="" disabled>选择计划（可选）</option>
              <option selected>V1.4.2 回归测试</option>
              <option>V1.4.3 迭代测试</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
