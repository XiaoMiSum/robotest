<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计划详情 · 功能测试 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
  /* 页面结构对齐 PlanDetailPage：页头条（返回 + 标题状态 + 进度统计 + 操作）+ 标签页 + 快照树(240) + 执行脑图 */
  .detail-head {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-lg);
    padding: 12px 16px; margin-bottom: 16px;
  }
  .detail-back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: var(--radius-md);
    color: var(--n-500); text-decoration: none; font-size: 16px;
  }
  .detail-back:hover { background: var(--n-100); color: var(--n-900); }
  .detail-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--n-900); white-space: nowrap; }
  .detail-extra { display: flex; align-items: center; gap: 20px; }
  .detail-progress { display: flex; align-items: center; gap: 12px; }
  .detail-progress .progress { width: 140px; }
  .detail-stats { display: flex; gap: 12px; }
  .detail-actions {
    display: flex; align-items: center; gap: 8px;
    padding-left: 20px; border-left: 1px solid var(--n-200);
  }

  /* 标签页：执行记录 / 执行顺序推荐（推荐项仅负责人与执行人可见） */
  .detail-tabs {
    display: flex; align-items: center; gap: 4px;
    border-bottom: 1px solid var(--n-200); margin-bottom: 16px;
  }

  .rv-workspace { display: flex; gap: 16px; align-items: stretch; }
  .rv-tree { width: 240px; flex-shrink: 0; }
  .rv-mind { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 脑图工具条（执行标记操作） */
  .mm-bar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 7px 12px; border-bottom: 1px solid var(--n-200);
  }
  .mm-tool {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 9px; border-radius: var(--radius-md);
    font-size: 12.5px; color: var(--n-600); background: transparent;
  }
  .mm-tool:hover { background: var(--n-100); color: var(--n-900); }
  .mm-sep { width: 1px; height: 15px; background: var(--n-200); margin: 0 5px; }
  .mm-spacer { flex: 1; }

  /* 脑图画布：快照树 + 执行标记徽标 + 推荐序号 */
  .mm {
    flex: 1; min-height: 440px; padding: 26px 30px; overflow: auto;
    background-image: radial-gradient(var(--n-200) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .mm ul { list-style: none; margin: 0; padding: 0; }
  .mm ul ul { margin-top: 4px; margin-left: 10px; padding-left: 20px; border-left: 1.5px solid var(--n-300); }
  .mm li { position: relative; padding: 6px 0; }
  .mm-node {
    position: relative;
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-lg);
    padding: 4px 12px; font-size: 13px; color: var(--n-800); box-shadow: var(--shadow-card);
  }
  .mm ul ul > li > .mm-node::before {
    content: ''; position: absolute; left: -21px; top: 50%;
    width: 15px; border-top: 1.5px solid var(--n-300);
  }
  .mm-node--root { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-600); font-weight: 600; }
  .mm-type { font-size: 11px; color: var(--n-500); }
  .tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .tdot--case { background: #a464ff; }
  .mm-badge { font-size: 11px; line-height: 1; padding: 3px 8px; border-radius: 999px; font-weight: 500; }
  .mm-badge--pass { background: #f0f9eb; color: #67c23a; }
  .mm-badge--fail { background: #fef0f0; color: #f56c6c; }
  .mm-badge--block { background: #f9eeee; color: #c45656; }
  .mm-badge--pending { background: var(--n-100); color: var(--n-500); }
  .mm-order {
    font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px; font-weight: 600;
    background: var(--brand-50); color: var(--brand-600); border: 1px solid var(--brand-100);
  }
</style>
</head>
<body data-shell="business" data-mode="project" data-active="ft" data-workspace="质量中台" data-project="电商核心系统">

<main class="content">

  <!-- 页头条：返回 + 标题/状态 + 进度统计 + 操作组 -->
  <div class="detail-head">
    <div class="flex-center flex-gap-sm">
      <a class="detail-back" href="plans.html" title="返回计划列表">←</a>
      <div class="flex-center flex-gap-sm">
        <h1 class="detail-title">V1.4.2 回归测试</h1>
        <span class="status status--running"><span class="dot"></span>进行中</span>
      </div>
    </div>
    <div class="detail-extra">
      <div class="detail-progress">
        <div class="progress">
          <div class="progress__track"><div class="progress__fill progress__fill--warning" style="width:58%"></div></div>
          <span class="progress__text">27/47</span>
        </div>
        <div class="detail-stats">
          <span class="text-xs" style="color:var(--st-success)">通过 24</span>
          <span class="text-xs" style="color:var(--st-danger)">失败 2</span>
          <span class="text-xs" style="color:var(--st-blocked)">阻塞 1</span>
          <span class="text-xs muted">待执行 20</span>
          <span class="text-xs muted">共 47</span>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn--default btn--sm"><span data-icon="sparkle"></span>AI 推荐用例</button>
        <button class="btn btn--default btn--sm"><span data-icon="edit"></span>调整用例</button>
        <button class="btn btn--default btn--sm"><span data-icon="refresh"></span>同步用例</button>
        <button class="btn btn--primary btn--sm"><span data-icon="check"></span>完成执行</button>
      </div>
    </div>
  </div>

  <!-- 标签页：执行记录（默认） / 执行顺序推荐 -->
  <div class="detail-tabs">
    <span class="tab tab--active">执行记录</span>
    <span class="tab" title="仅计划负责人 / 执行人可见">执行顺序推荐 ✨</span>
  </div>

  <!-- 工作区：快照文档树(240) + 执行脑图 -->
  <div class="rv-workspace">
    <div class="card rv-tree">
      <div class="card__header" style="padding:10px 14px">
        <h3 class="card__title" style="font-size:13px">快照文档</h3>
        <span class="text-xs muted">只读</span>
      </div>
      <div class="card__body" style="padding:8px 10px">
        <div class="tree">
          <div class="tree__item"><span data-icon="folder"></span>下单模块</div>
          <div class="tree__item tree__indent tree__item--active"><span data-icon="document"></span>下单主流程</div>
          <div class="tree__item" style="padding-left:44px"><span data-icon="document"></span>优惠券规则</div>
          <div class="tree__item"><span data-icon="folder"></span>支付模块</div>
          <div class="tree__item" style="padding-left:44px"><span data-icon="document"></span>支付回调</div>
          <div class="tree__item"><span data-icon="folder"></span>履约模块</div>
          <div class="tree__item" style="padding-left:44px"><span data-icon="document"></span>发货时效</div>
        </div>
      </div>
    </div>

    <div class="card rv-mind">
      <div class="mm-bar">
        <button class="mm-tool"><span data-icon="check"></span>标记通过</button>
        <button class="mm-tool"><span data-icon="x"></span>标记失败</button>
        <button class="mm-tool"><span data-icon="ban"></span>标记阻塞</button>
        <button class="mm-tool"><span data-icon="circle"></span>标记待执行</button>
        <span class="mm-sep"></span>
        <button class="mm-tool"><span data-icon="trash"></span>移除用例</button>
        <span class="mm-spacer"></span>
        <span class="text-xs muted">仅关联用例节点可标记 · ① 为执行顺序推荐序号</span>
      </div>
      <div class="mm">
        <ul>
          <li><span class="mm-node mm-node--root"><span data-icon="document"></span>下单主流程（执行快照）</span>
            <ul>
              <li><span class="mm-node"><i class="tdot tdot--case"></i>库存不足时下单拦截<span class="mm-order">1</span><span class="mm-badge mm-badge--pass">通过</span></span>
                <ul>
                  <li><span class="mm-node"><span class="mm-type">前置</span>目标商品库存为 0</span></li>
                  <li><span class="mm-node"><span class="mm-type">预期</span>提示库存不足并阻止下单</span></li>
                </ul>
              </li>
              <li><span class="mm-node"><i class="tdot tdot--case"></i>支付回调幂等性验证<span class="mm-order">2</span><span class="mm-badge mm-badge--fail">失败</span></span></li>
              <li><span class="mm-node"><i class="tdot tdot--case"></i>下单接口超时重试<span class="mm-order">3</span><span class="mm-badge mm-badge--block">阻塞</span></span></li>
              <li><span class="mm-node"><i class="tdot tdot--case"></i>多优惠券互斥规则<span class="mm-badge mm-badge--pending">待执行</span></span></li>
              <li><span class="mm-node"><i class="tdot tdot--case"></i>历史订单导出上限<span class="mm-badge mm-badge--pending">待执行</span></span></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>

</main>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
