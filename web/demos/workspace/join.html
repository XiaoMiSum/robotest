<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邀请加入空间 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .join-wrap { min-height: 100vh; background: var(--n-50); display: flex; flex-direction: column; align-items: center; padding: 56px 24px; }
  .join-logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--n-900); margin-bottom: 28px; }
  .join-card { width: 460px; }
  .invite-banner {
    display: flex; align-items: center; gap: 14px; padding: 18px 24px;
    background: var(--n-900); color: #fff; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .invite-banner .avatar { width: 40px; height: 40px; font-size: 15px; background: var(--brand-500); }
  .invite-banner b { color: var(--brand-300); font-weight: 600; }
  .invite-meta { display: flex; gap: 8px; margin-top: 6px; }
  .invite-meta span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); }
</style>
</head>
<body data-shell="bare">

<div class="join-wrap">
  <div class="join-logo"><span class="topbar__logo-mark"><span data-icon="zap"></span></span>RoboTest</div>

  <div class="card join-card" style="overflow:hidden">
    <div class="invite-banner">
      <span class="avatar">张</span>
      <div>
        <div style="font-size:14px">张明 邀请你加入 <b>质量中台</b> 空间</div>
        <div class="invite-meta"><span>角色：测试工程师</span><span>剩余 5 次可用</span></div>
      </div>
    </div>

    <div class="tabs">
      <span class="tab tab--active">已有账号，登录加入</span>
      <span class="tab">注册新账号</span>
    </div>

    <div class="card__body">
      <div class="field">
        <label class="field__label">邮箱</label>
        <div class="input-wrap"><span data-icon="user"></span><input class="input" placeholder="受邀邮箱" value="lihua@robotest.cn"></div>
      </div>
      <div class="field">
        <label class="field__label">密码</label>
        <div class="input-wrap"><span data-icon="lock"></span><input class="input" type="password" placeholder="登录密码" value="12345678"></div>
      </div>

      <button class="btn btn--primary btn--lg btn--block">加入空间</button>

      <div class="text-xs text-light text-center" style="margin-top:20px">
        注册新账号时需填写姓名、邮箱与密码，加入后由空间管理员分配角色
      </div>
    </div>
  </div>

  <div class="text-xs text-light" style="margin-top:24px">
    邀请链接将在 <span class="mono">2026-09-27</span> 过期 · <a href="../auth/login.html">返回登录</a>
  </div>
</div>

<script src="../assets/icons.js"></script>
</body>
</html>
