<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建用户 · 系统管理 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
</head>
<body data-shell="admin" data-active="users" data-mode="admin">

<main class="content content--admin">

  <div class="breadcrumb">
    <a href="users.html">用户管理</a>
    <span data-icon="chevron-right"></span>
    <span>新建用户</span>
  </div>

  <div class="page-head">
    <div>
      <h1 class="page-head__title">新建用户</h1>
      <p class="page-head__desc">创建平台账号并分配系统级角色</p>
    </div>
    <div class="page-head__actions">
      <a class="btn btn--text" href="users.html">取消</a>
      <button class="btn btn--primary">保存</button>
    </div>
  </div>

  <div class="card-grid card-grid--2">
    <div class="card">
      <div class="card__header"><h3 class="card__title">基本信息</h3></div>
      <div class="card__body">
        <div class="field">
          <label class="field__label">用户名<span class="req">*</span></label>
          <input class="input" placeholder="登录账号，字母数字组合" value="zhoumin">
          <div class="field__hint">4–32 位，仅允许字母、数字与下划线</div>
        </div>
        <div class="field">
          <label class="field__label">昵称<span class="req">*</span></label>
          <input class="input" placeholder="显示名称" value="周敏">
        </div>
        <div class="field">
          <label class="field__label">邮箱<span class="req">*</span></label>
          <input class="input" placeholder="用于登录与通知" value="zhoumin@robotest.cn">
        </div>
        <div class="form-grid">
          <div class="field">
            <label class="field__label">初始密码<span class="req">*</span></label>
            <input class="input" type="password" value="Passw0rd!">
          </div>
          <div class="field">
            <label class="field__label">确认密码<span class="req">*</span></label>
            <input class="input" type="password" value="Passw0rd!">
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label class="field__label">状态</label>
          <div class="flex-center flex-gap-lg">
            <span class="flex-center flex-gap-sm text-sm"><span class="radio checkbox checkbox--on" style="border-radius:50%"></span>启用</span>
            <span class="flex-center flex-gap-sm text-sm muted"><span class="checkbox" style="border-radius:50%"></span>停用</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card__header">
        <h3 class="card__title">系统角色<span class="card__subtitle">决定全局管理权限</span></h3>
      </div>
      <div class="card__body">
        <div class="field">
          <div class="flex-center flex-gap-sm mb-lg" style="align-items:flex-start">
            <span class="checkbox checkbox--on" style="margin-top:3px"></span>
            <div>
              <div class="text-sm strong">系统管理员</div>
              <div class="text-xs muted">拥有全部系统管理权限，可管理用户、空间与全局配置</div>
            </div>
          </div>
          <div class="flex-center flex-gap-sm mb-lg" style="align-items:flex-start">
            <span class="checkbox" style="margin-top:3px"></span>
            <div>
              <div class="text-sm strong">空间管理员</div>
              <div class="text-xs muted">可代管指定工作空间的成员与项目</div>
            </div>
          </div>
          <div class="flex-center flex-gap-sm mb-lg" style="align-items:flex-start">
            <span class="checkbox" style="margin-top:3px"></span>
            <div>
              <div class="text-sm strong">测试工程师</div>
              <div class="text-xs muted">默认业务角色，可在加入的空间内执行测试工作</div>
            </div>
          </div>
          <div class="flex-center flex-gap-sm" style="align-items:flex-start">
            <span class="checkbox" style="margin-top:3px"></span>
            <div>
              <div class="text-sm strong">只读成员</div>
              <div class="text-xs muted">仅可查看，不可编辑任何业务数据</div>
            </div>
          </div>
        </div>

        <hr class="divider divider--dashed">

        <div class="alert alert--info">
          <span data-icon="info-filled"></span>
          <div>创建后系统将发送激活邮件，用户首次登录需修改初始密码。</div>
        </div>
      </div>
    </div>
  </div>

  <div class="btn-row block-gap" style="justify-content:flex-end">
    <a class="btn btn--default" href="users.html">返回列表</a>
    <button class="btn btn--primary">保存并创建</button>
  </div>

</main>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
