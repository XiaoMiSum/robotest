<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 配置 · 系统管理 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
</head>
<body data-shell="admin" data-active="ai-config" data-mode="admin">

<main class="content content--admin">

  <div class="page-head">
    <div>
      <h1 class="page-head__title">AI 配置</h1>
      <p class="page-head__desc">模型接入参数与调用统计 · 服务状态 <span class="status status--success" style="margin-left:6px"><span class="dot"></span>正常</span></p>
    </div>
    <div class="page-head__actions">
      <button class="btn btn--default"><span data-icon="zap"></span>连通性测试</button>
      <button class="btn btn--primary">保存配置</button>
    </div>
  </div>

  <div class="card-grid card-grid--3">
    <div class="card kpi"><div class="kpi__label"><span data-icon="sparkle"></span>今日调用</div><div class="kpi__value">1,284<span class="unit">次</span></div><div class="kpi__foot">较昨日 <span class="kpi__delta kpi__delta--up">+12.4%</span></div></div>
    <div class="card kpi"><div class="kpi__label"><span data-icon="check-circle"></span>成功率</div><div class="kpi__value">99.6<span class="unit">%</span></div><div class="kpi__foot">失败 5 次（均已重试）</div></div>
    <div class="card kpi"><div class="kpi__label"><span data-icon="timer"></span>平均耗时</div><div class="kpi__value">1.8<span class="unit">s</span></div><div class="kpi__foot">P95 3.4s</div></div>
  </div>

  <div class="card-grid card-grid--2 block-gap">
    <div class="card">
      <div class="card__header"><h3 class="card__title">模型接入</h3></div>
      <div class="card__body">
        <div class="form-grid">
          <div class="field">
            <label class="field__label">供应商</label>
            <select class="select"><option>OpenAI 兼容接口</option></select>
          </div>
          <div class="field">
            <label class="field__label">模型</label>
            <select class="select"><option>gpt-4o-mini</option></select>
          </div>
          <div class="field">
            <label class="field__label">API Key<span class="req">*</span></label>
            <div class="input-wrap"><span data-icon="key"></span><input class="input mono" value="sk-**** **** **** 9f2a" readonly></div>
            <div class="field__hint">加密存储，仅展示末四位</div>
          </div>
          <div class="field">
            <label class="field__label">最大 Tokens</label>
            <input class="input num" value="4096">
          </div>
          <div class="field">
            <label class="field__label">Temperature</label>
            <div class="flex-center flex-gap-md">
              <div class="progress__track" style="flex:1"><div class="progress__fill progress__fill--brand" style="width:30%"></div></div>
              <span class="mono text-sm">0.3</span>
            </div>
          </div>
          <div class="field">
            <label class="field__label">超时（秒）</label>
            <input class="input num" value="30">
          </div>
        </div>
        <div class="flex-between" style="padding-top:4px">
          <div>
            <div class="text-sm strong">启用 AI 能力</div>
            <div class="text-xs muted">关闭后智能助手与 AI 生成入口将隐藏</div>
          </div>
          <span class="switch switch--on"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card__header">
        <h3 class="card__title">近 7 日调用量</h3>
        <div class="legend"><span class="legend__item"><span class="legend__swatch" style="background:#409eff"></span>调用次数</span></div>
      </div>
      <div class="card__body">
        <svg class="chart" height="180" viewBox="0 0 460 180">
          <line x1="0" y1="150" x2="460" y2="150" stroke="#e4e7ed"/>
          <line x1="0" y1="100" x2="460" y2="100" stroke="#f0f2f5"/>
          <line x1="0" y1="50" x2="460" y2="50" stroke="#f0f2f5"/>
          <rect x="24" y="86" width="34" height="64" rx="3" fill="#c7d9ff"/>
          <rect x="84" y="72" width="34" height="78" rx="3" fill="#c7d9ff"/>
          <rect x="144" y="94" width="34" height="56" rx="3" fill="#c7d9ff"/>
          <rect x="204" y="58" width="34" height="92" rx="3" fill="#94b5ff"/>
          <rect x="264" y="66" width="34" height="84" rx="3" fill="#94b5ff"/>
          <rect x="324" y="44" width="34" height="106" rx="3" fill="#6392ff"/>
          <rect x="384" y="34" width="34" height="116" rx="3" fill="#409eff"/>
          <text x="41" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周二</text>
          <text x="101" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周三</text>
          <text x="161" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周四</text>
          <text x="221" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周五</text>
          <text x="281" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周六</text>
          <text x="341" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周日</text>
          <text x="401" y="168" font-size="10" fill="#a8abb2" text-anchor="middle">周一</text>
        </svg>

        <hr class="divider">

        <table class="table">
          <thead><tr><th>功能入口</th><th>调用</th><th>成功率</th></tr></thead>
          <tbody>
            <tr><td>用例生成</td><td class="num">562</td><td><span class="status status--success"><span class="dot"></span>99.8%</span></td></tr>
            <tr><td>缺陷摘要</td><td class="num">431</td><td><span class="status status--success"><span class="dot"></span>99.5%</span></td></tr>
            <tr><td>智能助手对话</td><td class="num">291</td><td><span class="status status--warning"><span class="dot"></span>98.6%</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
