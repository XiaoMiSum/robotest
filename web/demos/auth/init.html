<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初始化 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .init-wrap { position: relative; min-height: 100vh; background: var(--n-50); display: flex; align-items: center; justify-content: center; padding: 40px 24px; overflow: hidden; }
  /* 细点阵中心向四周渐隐，弱化空旷感 */
  .init-wrap::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(100, 116, 139, 0.12) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse at 50% 35%, #000 30%, transparent 75%);
  }
  .init-card { position: relative; width: 440px; padding: 40px 40px 32px; }
  /* 内边距已由卡片自身给出，抵消 card__body 默认内边距避免双层留白 */
  .init-card .card__body { padding: 0; }
  .init-card__brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .init-card__brand .topbar__logo-mark { width: 34px; height: 34px; border-radius: 8px; }
  .init-card__brand .topbar__logo-mark svg { width: 22px; height: 22px; }
  .init-card__logo-text { font-size: 22px; font-weight: 700; color: var(--n-900); letter-spacing: -0.01em; }
  .init-card__desc { text-align: center; font-size: 13px; color: var(--n-500); margin-bottom: 24px; }
  .init-card__hints {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    padding: 10px 12px; margin-bottom: 16px;
    border-radius: var(--radius-md);
    background: var(--n-50); border: 1px solid var(--n-100);
  }
  .init-card__hint { font-size: 12px; line-height: 1.6; color: var(--n-400); }
  .init-card__hint--ok { color: var(--st-success-strong); }
  .pwd-strength { display: flex; align-items: center; gap: 8px; margin-top: 6px; width: 100%; }
  .pwd-strength__bar { flex: 1; display: flex; gap: 4px; }
  .pwd-strength__segment { flex: 1; height: 4px; border-radius: 999px; background: var(--n-200); transition: background-color 0.3s ease; }
  .pwd-strength__label { font-size: var(--font-size-2xs); font-weight: 500; white-space: nowrap; }
  .init-card__btn { width: 100%; letter-spacing: 0.15em; text-indent: 0.15em; }
  .init-card__footer { text-align: center; font-size: 12px; color: var(--n-400); margin-top: 8px; }
</style>
</head>
<body data-shell="bare">

<div class="init-wrap">
  <div class="card init-card">
    <div class="card__body">
      <div class="init-card__brand">
        <span class="topbar__logo-mark"><span data-icon="zap"></span></span>
        <span class="init-card__logo-text">RoboTest</span>
      </div>

      <div class="init-card__desc">首次部署，请为系统管理员设置登录密码</div>

      <div class="field">
        <label class="field__label">登录名</label>
        <div class="input-wrap">
          <span data-icon="user"></span>
          <input class="input" value="admin" disabled>
        </div>
      </div>

      <div class="field">
        <label class="field__label">管理员密码</label>
        <div class="input-wrap">
          <span data-icon="lock"></span>
          <input class="input" type="password" placeholder="请输入密码（8-64 个字符）" value="Passw0rd!">
        </div>
        <div class="pwd-strength">
          <div class="pwd-strength__bar">
            <span class="pwd-strength__segment" style="background-color: var(--st-danger)"></span>
            <span class="pwd-strength__segment" style="background-color: var(--st-warning)"></span>
            <span class="pwd-strength__segment" style="background-color: var(--st-success-strong)"></span>
            <span class="pwd-strength__segment" style="background-color: var(--st-success)"></span>
          </div>
          <span class="pwd-strength__label" style="color: var(--st-success)">强</span>
        </div>
      </div>

      <div class="field">
        <label class="field__label">确认密码</label>
        <div class="input-wrap">
          <span data-icon="lock"></span>
          <input class="input" type="password" placeholder="请再次输入密码" value="Passw0rd!">
        </div>
      </div>

      <div class="init-card__hints">
        <span class="init-card__hint init-card__hint--ok">✓ 8-64 个字符</span>
        <span class="init-card__hint init-card__hint--ok">✓ 包含字母</span>
        <span class="init-card__hint init-card__hint--ok">✓ 包含数字与符号更安全</span>
      </div>

      <button class="btn btn--primary btn--lg init-card__btn">完成初始化</button>

      <div class="init-card__footer">初始化完成后将跳转至登录页</div>
    </div>
  </div>
</div>

<script src="../assets/icons.js"></script>
</body>
</html>
