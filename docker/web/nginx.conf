# docker/web/nginx.conf — compose 前端容器配置（以 scripts/nginx.conf.example 为基线）
# 差异点：upstream 指向 compose 服务名 server:58080；请求体上限对齐 multipart 21MB；
# /api 关闭响应缓冲以放行 SSE 流式（AI 输出）。conf.d/*.conf 被 include 进 http{}，
# 顶层 map / log_format 合法；access_log 放在 server 内以覆盖镜像默认的 http 级声明。

upstream backend {
    server server:58080;
}

# 访问日志脱敏（安全规范 2.2、实时协议详细设计 3.2）：
# WS 握手等 URL 携带 ticket/token 查询参数，凭证类参数不得进入访问日志。
map $args $safe_args {
    default                                                             $args;
    "~*(^|&)[^=]*(access[_-]?token|token|ticket|password|passwd|secret|api[_-]?key|authorization|cookie|credential)="  "[redacted]";
}

map $safe_args $safe_request_uri {
    default  "$uri?$safe_args";
    ""       "$uri";
}

log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $safe_request_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log masked;

    # multipart 模块级上限 20MB + 边界余量 21MB（文件管理详设 5.2）
    client_max_body_size 21m;

    # API 请求反向代理至后端（同域相对路径，见 web/.env.production）
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式（AI 输出）禁用缓冲：默认缓冲会聚合到响应结束才释放
        proxy_buffering off;
        # AI 生成间隔可能超过默认 60s 空闲读超时，须放行长等待（部署 runbook 9.1）
        proxy_read_timeout 3600s;
    }

    # WebSocket（Yjs 实时协作）需要 Upgrade 头透传
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 协同编辑长连接，避免默认 60s 空闲被 Nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 前端路由回退到 index.html
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}
