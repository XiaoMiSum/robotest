<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 任务详情 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/ux.css">
<style>
  [hidden] { display: none !important; }

  .task-breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: var(--font-size-sm); }
  .task-breadcrumb__link { color: var(--brand-500); text-decoration: none; cursor: pointer; }
  .task-breadcrumb__link:hover { color: var(--brand-600); }
  .task-breadcrumb__sep { color: var(--n-400); }
  .task-breadcrumb__current { max-width: min(560px, 60vw); overflow: hidden; color: var(--n-500); text-overflow: ellipsis; white-space: nowrap; }

  .task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .task-head__main { min-width: 0; flex: 1; }
  .task-head__title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .task-head__title { margin: 0; color: var(--n-900); font-size: var(--font-size-2xl); font-weight: 650; letter-spacing: -0.01em; }
  .task-head__meta { margin: 6px 0 0; color: var(--n-500); font-size: var(--font-size-sm); }
  .task-head__actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn--text-warning { color: var(--st-warning); }
  .btn--text-warning:hover { background: var(--st-warning-light, #fff7e6); color: var(--st-warning); }
  .btn--text-primary { color: var(--brand-500); }
  .btn--text-primary:hover { background: var(--brand-50); color: var(--brand-600); }
  .btn--danger-plain { background: var(--st-danger-light, #fff1f0); border-color: var(--st-danger-border, #ffccc7); color: var(--st-danger); }
  .btn--danger-plain:hover { background: var(--st-danger); border-color: var(--st-danger); color: #fff; }
  .btn--link.is-copied { color: var(--st-success); }

  .task-section { margin-bottom: 16px; }
  .task-section__title { margin: 0 0 8px; color: var(--n-900); font-size: var(--font-size-lg); font-weight: 650; }

  .detail-skeleton, .detail-state { padding: 16px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .skeleton-line { height: 14px; margin-bottom: 12px; background: linear-gradient(90deg, var(--n-100) 25%, var(--n-50) 37%, var(--n-100) 63%); background-size: 400% 100%; border-radius: 4px; animation: sk 1.4s ease infinite; }
  .skeleton-line:last-child { margin-bottom: 0; width: 60%; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .result-block { padding: 40px 16px; text-align: center; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .result-block__icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin-bottom: 12px; border-radius: 50%; font-size: 28px; font-weight: 700; }
  .result-block__icon--warning { background: var(--st-warning-light, #fff7e6); color: var(--st-warning); }
  .result-block__icon--info { background: var(--n-100); color: var(--n-500); }
  .result-block__title { margin: 0; color: var(--n-900); font-size: var(--font-size-lg); font-weight: 650; }
  .result-block__sub { margin: 8px 0 0; color: var(--n-500); font-size: var(--font-size-sm); }
  .result-block__extra { margin-top: 16px; }

  .execution-panel { padding: 16px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .execution-panel__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .execution-panel__seq { color: var(--n-500); font-size: var(--font-size-sm); }
  .execution-panel__metrics { color: var(--n-700); font-size: var(--font-size-sm); font-variant-numeric: tabular-nums; }
  .execution-panel__terminate { margin: 8px 0 0; color: var(--st-danger); font-size: var(--font-size-sm); }

  .plan-timeline { display: flex; flex-wrap: wrap; gap: 16px; margin: 0; padding: 16px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); list-style: none; }
  .plan-timeline__item { display: inline-flex; align-items: center; gap: 6px; color: var(--n-400); font-size: var(--font-size-sm); }
  .plan-timeline__dot { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 2px solid currentcolor; border-radius: 50%; font-size: 11px; line-height: 1; }
  .plan-timeline__item--done { color: var(--st-success); }
  .plan-timeline__item--done .plan-timeline__dot { background: var(--st-success); border-color: var(--st-success); color: #fff; }
  .plan-timeline__item--current { color: var(--brand-500); }
  .plan-timeline__item--current .plan-timeline__dot { background: var(--brand-500); border-color: var(--brand-500); }
  .plan-timeline__item--aborted { color: var(--st-danger); }
  .plan-timeline__item--aborted .plan-timeline__dot { background: var(--st-danger); border-color: var(--st-danger); color: #fff; }

  .trace-events { padding: 8px 16px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .trace-events__head { display: flex; align-items: center; gap: 8px; }
  .trace-events__count { color: var(--n-500); font-size: var(--font-size-xs); }
  .trace-events__body { margin-top: 8px; padding-bottom: 8px; }
  .trace-events__list { margin: 0; padding: 0; list-style: none; }
  .trace-events__item { padding: 6px 0; border-bottom: 1px solid var(--n-100); font-size: var(--font-size-sm); }
  .trace-events__row { display: flex; align-items: baseline; gap: 8px; }
  .trace-events__seq { flex-shrink: 0; color: var(--n-400); font-variant-numeric: tabular-nums; }
  .trace-events__summary { flex: 1; min-width: 0; color: var(--n-700); overflow-wrap: anywhere; }
  .trace-events__time { flex-shrink: 0; color: var(--n-400); font-size: var(--font-size-xs); }
  .trace-events__detail { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding: 8px; background: var(--n-50); border-radius: var(--radius-sm); }
  .trace-events__section-head { display: flex; align-items: center; justify-content: space-between; }
  .trace-events__section-title { color: var(--n-700); font-weight: 600; font-size: var(--font-size-sm); }
  .trace-events__json { margin-top: 6px; padding: 8px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-sm); color: var(--n-700); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .trace-events__empty { padding: 4px 0; color: var(--n-400); font-size: var(--font-size-sm); }
  .trace-events__more { display: flex; justify-content: center; padding-top: 8px; }

  .proposal-review { padding: 16px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .proposal-review__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .proposal-review__head-main { display: flex; align-items: baseline; gap: 8px; }
  .proposal-review__title { margin: 0; color: var(--n-900); font-size: var(--font-size-lg); font-weight: 650; }
  .proposal-review__processed, .proposal-review__kind, .proposal-review__meta, .proposal-review__evidence { color: var(--n-500); font-size: var(--font-size-sm); }
  .proposal-review__version { display: flex; align-items: center; gap: 6px; }
  .proposal-review__nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding-bottom: 8px; }
  .proposal-review__nav-pos { color: var(--n-500); font-size: var(--font-size-sm); }
  .proposal-review__item { border-top: 1px solid var(--n-200); }
  .proposal-review__item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
  .proposal-review__name { flex: 1; min-width: 160px; overflow: hidden; color: var(--n-900); font-size: var(--font-size-sm); font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
  .proposal-review__item-body { min-height: 72px; }
  .proposal-review__note { margin: 0 0 8px; color: var(--st-danger); font-size: var(--font-size-sm); }
  .proposal-review__desc-text { margin: 8px 0; color: var(--n-700); font-size: var(--font-size-sm); line-height: 1.6; }
  .proposal-review__fields { margin: 0 0 8px; }
  .proposal-review__field { display: flex; gap: 8px; padding: 4px 0; font-size: var(--font-size-sm); }
  .proposal-review__field dt { flex: 0 0 96px; color: var(--n-500); }
  .proposal-review__field dd { flex: 1; margin: 0; color: var(--n-700); }
  .proposal-review__sources { padding-top: 8px; border-top: 1px solid var(--n-200); }
  .proposal-review__source-title { margin-right: 6px; color: var(--n-900); font-size: var(--font-size-sm); }
  .proposal-review__source-quote { color: var(--n-500); font-size: var(--font-size-sm); }

  .compare-view { margin: 6px 0 10px; }
  .compare-view__head, .compare-view__row { display: grid; grid-template-columns: minmax(72px, 1fr) minmax(0, 2fr) minmax(0, 2fr); column-gap: 8px; }
  .compare-view__head { font-size: var(--font-size-xs); }
  .compare-view__head-cell { padding-bottom: 4px; color: var(--n-500); }
  .compare-view__head-cell--new { color: var(--brand-500); }
  .compare-view__row { padding: 4px 0; border-bottom: 1px solid var(--n-200); font-size: var(--font-size-sm); }
  .compare-view__row--changed { padding-left: 8px; background: var(--st-success-light, #f0faf3); box-shadow: inset 3px 0 0 var(--st-success); }
  .compare-view__label, .compare-view__existing, .compare-view__suggested { line-height: 1.5; word-break: break-word; }
  .compare-view__label { color: var(--n-500); font-weight: 600; }
  .compare-view__existing { color: var(--n-500); }
  .compare-view__suggested { color: var(--n-900); }
  .compare-view__fold { margin-top: 4px; }

  .empty-block { padding: 24px 16px; text-align: center; background: var(--n-0); border: 1px solid var(--n-200); border-radius: var(--radius-md); }
  .empty-block__text { margin: 0 0 12px; color: var(--n-500); font-size: var(--font-size-sm); }
</style>
</head>
<body data-shell="business" data-mode="project" data-workspace="质量中台" data-project="电商核心系统">

<main class="content content--flush">
  <div class="split">
    <div class="split__main">
      <nav class="task-breadcrumb" aria-label="面包屑">
        <a class="task-breadcrumb__link" href="ai-task-center.html">AI 任务中心</a>
        <span class="task-breadcrumb__sep" aria-hidden="true">›</span>
        <span class="task-breadcrumb__current" id="dt-breadcrumb">任务详情</span>
      </nav>

      <div id="dt-not-found" class="result-block" hidden>
        <div class="result-block__icon result-block__icon--info">?</div>
        <h2 class="result-block__title">任务不存在或无权访问</h2>
        <p class="result-block__sub">任务可能已被删除，或当前账号无权查看</p>
        <div class="result-block__extra"><a class="btn btn--primary" href="ai-task-center.html">返回任务中心</a></div>
      </div>

      <div id="dt-loading" class="detail-skeleton" hidden>
        <div class="skeleton-line" style="width:88%"></div>
        <div class="skeleton-line" style="width:94%"></div>
        <div class="skeleton-line" style="width:72%"></div>
        <div class="skeleton-line" style="width:90%"></div>
        <div class="skeleton-line" style="width:66%"></div>
        <div class="skeleton-line" style="width:84%"></div>
        <div class="skeleton-line" style="width:78%"></div>
        <div class="skeleton-line"></div>
      </div>

      <div id="dt-load-error" class="detail-state" hidden>
        <div class="alert alert--danger" style="margin:0">
          <span id="dt-load-error-text">加载任务详情失败</span>
          <button class="btn btn--danger-plain btn--sm" type="button" id="dt-retry" style="margin-left:12px">重试</button>
        </div>
      </div>

      <div id="dt-ai-unavailable" class="result-block" hidden>
        <div class="result-block__icon result-block__icon--warning">!</div>
        <h2 class="result-block__title">AI 能力未启用 / 未配置模型</h2>
        <p class="result-block__sub">开启 AI 总开关并配置可用模型后可继续使用</p>
      </div>

      <div id="dt-content" hidden>
        <header class="task-head">
          <div class="task-head__main">
            <div class="task-head__title-row">
              <h1 class="task-head__title" id="dt-title">任务详情</h1>
              <span class="tag tag--sm" id="dt-status">执行中</span>
              <span class="tag tag--sm" id="dt-adoption" hidden>部分采纳</span>
            </div>
            <p class="task-head__meta" id="dt-meta"></p>
          </div>
          <div class="task-head__actions" id="dt-actions"></div>
        </header>

        <section class="task-section">
          <div class="execution-panel">
            <div class="execution-panel__head">
              <span class="tag tag--sm" id="dt-exec-task-status">执行中</span>
              <span class="tag tag--sm" id="dt-exec-badge" hidden>已成功</span>
              <span class="execution-panel__seq" id="dt-exec-seq" hidden></span>
              <span class="execution-panel__metrics" id="dt-exec-metrics"></span>
            </div>
            <p class="execution-panel__terminate" id="dt-terminate" hidden></p>
          </div>
        </section>

        <section class="task-section" id="dt-plan-section" hidden>
          <h2 class="task-section__title">计划步骤</h2>
          <ol class="plan-timeline" id="dt-plan-list"></ol>
        </section>

        <section class="task-section" id="dt-trace-section" hidden>
          <div class="trace-events">
            <div class="trace-events__head">
              <button class="btn btn--link" type="button" id="dt-trace-toggle">展开轨迹 ▾</button>
              <button class="btn btn--text btn--sm" type="button" id="dt-trace-refresh" hidden>刷新</button>
              <span class="trace-events__count" id="dt-trace-count" hidden></span>
            </div>
            <div class="trace-events__body" id="dt-trace-body" hidden>
              <ul class="trace-events__list" id="dt-trace-list"></ul>
              <div class="trace-events__more" id="dt-trace-more" hidden>
                <button class="btn btn--default btn--sm" type="button" id="dt-trace-load-more">加载更多</button>
              </div>
            </div>
          </div>
        </section>

        <section class="task-section" id="dt-proposal-section" hidden>
          <div class="proposal-review">
            <header class="proposal-review__head">
              <div class="proposal-review__head-main">
                <h2 class="proposal-review__title" id="dt-proposal-title">提案与审核结果</h2>
                <span class="proposal-review__processed" id="dt-proposal-processed"></span>
              </div>
              <div class="proposal-review__version" id="dt-proposal-version" hidden>
                <span class="proposal-review__evidence">版本</span>
                <span class="proposal-review__evidence" id="dt-proposal-version-value"></span>
              </div>
            </header>
            <div class="proposal-review__nav" id="dt-proposal-nav" hidden>
              <button class="btn btn--link" type="button" id="dt-proposal-prev">上一个</button>
              <span class="proposal-review__nav-pos" id="dt-proposal-pos"></span>
              <button class="btn btn--link" type="button" id="dt-proposal-next">下一个</button>
            </div>
            <div class="proposal-review__item" id="dt-proposal-card">
              <div class="proposal-review__item-head">
                <span class="proposal-review__kind" id="dt-proposal-kind"></span>
                <span class="proposal-review__name" id="dt-proposal-name"></span>
                <span class="tag tag--sm" id="dt-proposal-status"></span>
              </div>
              <div class="proposal-review__item-body">
                <p class="proposal-review__note" id="dt-proposal-note" hidden></p>
                <p class="proposal-review__desc-text" id="dt-proposal-desc" hidden></p>
                <div id="dt-proposal-compare"></div>
                <dl class="proposal-review__fields" id="dt-proposal-fields"></dl>
                <div class="proposal-review__sources" id="dt-proposal-sources" hidden></div>
              </div>
            </div>
          </div>
        </section>

        <section class="task-section" id="dt-empty-proposals" hidden>
          <div class="empty-block">
            <p class="empty-block__text">任务完成，但没有需要审核的提案</p>
            <a class="btn btn--default" href="ai-task-center.html">返回任务中心</a>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>

<div class="dialog-mask" id="dt-confirm-dialog" data-mask-close hidden>
  <div class="dialog" style="width:420px">
    <div class="dialog__header">
      <span class="dialog__title">确认终止执行</span>
      <button class="dialog__close" data-close="dt-confirm-dialog" aria-label="关闭"><span data-icon="x"></span></button>
    </div>
    <div class="dialog__body">
      <p style="margin:0;color:var(--n-600)">终止后本任务停止执行，不产生任何落库数据，可再次执行。</p>
    </div>
    <div class="dialog__footer">
      <button class="btn btn--default" type="button" data-close="dt-confirm-dialog">不终止</button>
      <button class="btn btn--primary" type="button" id="dt-confirm-ok">终止执行</button>
    </div>
  </div>
</div>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/ux.js"></script>

    abortScene.trace.push({
      seq: nextTraceSeq(abortScene), eventType: 'status_change',
      summary: 'running → aborted（用户手动终止）', createdAt: new Date().toISOString()
    });
    render(currentScene, { preserveView: true });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') byId('dt-confirm-dialog').hidden = true;
  });
  byId('dt-confirm-dialog').addEventListener('click', function (e) {
    if (e.target === this) this.hidden = true;
  });

  var params = new URLSearchParams(window.location.search);
  var initial = params.get('scene');
  render(initial && scenes[initial] ? initial : 'proposals_ready');
})();
</script>
</body>
</html>
