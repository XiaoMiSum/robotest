<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口测试 · 新建定时任务 · RoboTest</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/ux.css">
<style>
  [hidden] { display: none !important; }

  .dialog { width: 640px; }

  /* 对齐实际 el-form label-width="100px" 的横向表单布局 */
  .schedule-form .field {
    display: flex;
    align-items: flex-start;
    gap: 0;
    margin-bottom: 18px;
  }
  .schedule-form .field__label {
    width: 100px;
    flex-shrink: 0;
    margin-bottom: 0;
    padding-top: 6px;
    padding-right: 12px;
    text-align: right;
    font-size: var(--font-size-sm);
    font-weight: 400;
    color: var(--n-700);
  }
  .schedule-form .field__label.is-required::before {
    content: "*";
    color: var(--st-danger);
    margin-right: 4px;
  }
  .schedule-form .field__content {
    flex: 1;
    min-width: 0;
  }
  .schedule-form .field__hint {
    margin-top: 4px;
    font-size: var(--font-size-xs);
    color: var(--n-500);
  }

  .radio-group { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; min-height: 32px; }
  .radio-line { display: inline-flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); color: var(--n-700); cursor: pointer; user-select: none; }
  .radio-line.is-disabled { color: var(--n-400); cursor: not-allowed; }
  .radio-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--n-300); background: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .radio-line.is-active .radio-dot { border-color: var(--brand-500); }
  .radio-line.is-active .radio-dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-500); }
  .radio-line.is-disabled .radio-dot { border-color: var(--n-200); background: var(--n-50); }

  /* 模块树（对照实际页 el-tree-select：多选 + show-checkbox + check-strictly） */
  .mod-tree { border: 1px solid var(--n-200); border-radius: var(--radius-md); padding: 6px 8px; width: 100%; max-height: 190px; overflow: auto; background: var(--n-0); }
  .mod-node { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: var(--font-size-sm); color: var(--n-700); cursor: pointer; border-radius: var(--radius-sm); }
  .mod-node:hover { background: var(--n-50); }
  .mod-node--child { padding-left: 26px; }
  .mod-placeholder { color: var(--n-400); font-size: var(--font-size-sm); padding: 4px 6px; }

  /* 场景标签（对照实际页 el-tag closable + scene-tag） */
  .scene-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 32px; }
  .scene-tag { display: inline-flex; align-items: center; gap: 4px; max-width: 200px; padding: 0 8px; height: 24px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); background: var(--n-50); border: 1px solid var(--n-200); color: var(--n-700); }
  .scene-tag__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scene-tag__close { cursor: pointer; color: var(--n-400); font-size: 14px; line-height: 1; flex-shrink: 0; }
  .scene-tag__close:hover { color: var(--n-700); }

  /* Cron 区域（对照实际页 cron-field / cron-validation / cron-builder） */
  .cron-field { display: flex; align-items: center; gap: 8px; width: 100%; }
  .cron-field .select--preset { width: 160px; flex-shrink: 0; }
  .cron-field .input--cron { flex: 1; min-width: 0; }
  .cron-validation { margin-top: 8px; font-size: 12px; color: var(--n-500); }
  .cron-validation.is-invalid { color: var(--st-danger); }
  .cron-next { margin: 4px 0 0; padding-left: 18px; }
  .cron-next li { margin: 2px 0; }
  .cron-builder { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .cron-builder .input { width: 80px; text-align: center; }

  .switch { position: relative; width: 40px; height: 20px; border-radius: 10px; background: var(--n-300); border: none; cursor: pointer; padding: 0; transition: background .2s; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
  .switch.is-on { background: var(--brand-500); }
  .switch.is-on::after { left: 22px; }
  .switch-row { display: flex; align-items: center; min-height: 32px; }

  .cell-edit { cursor: pointer; }
  .cell-edit:hover { color: var(--brand-600); }

  /* 执行记录抽屉：本页独立样式，不改动公共 assets */
  .rt-exec-mask { position: fixed; inset: 0; background: rgba(15,15,17,.45); z-index: 205; }
  .rt-exec-drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 210; width: 680px; max-width: 92vw; display: flex; flex-direction: column; background: var(--n-0); box-shadow: -4px 0 16px rgba(0,0,0,.18); }
  .rt-exec-drawer__head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--n-100); }
  .rt-exec-drawer__title { font-size: var(--font-size-lg); font-weight: 600; color: var(--n-900); }
  .rt-exec-drawer__close { border: 0; background: none; color: var(--n-400); cursor: pointer; display: inline-flex; padding: 2px; font-size: 18px; line-height: 1; }
  .rt-exec-drawer__close:hover { color: var(--n-700); }
  .rt-exec-drawer__body { flex: 1; overflow: auto; padding: 20px; }
  .rt-exec-drawer__body .table th, .rt-exec-drawer__body .table td { padding: 10px 12px; font-size: var(--font-size-sm); }
  .rt-exec-drawer__foot { flex-shrink: 0; padding: 12px 20px; border-top: 1px solid var(--n-100); font-size: var(--font-size-xs); color: var(--n-500); }
  .picker-count { display: block; margin-bottom: 6px; font-size: var(--font-size-xs); color: var(--n-500); }
</style>
</head>
<body data-shell="business" data-mode="project" data-active="api" data-workspace="质量中台" data-project="电商核心系统">

<main class="content content--flush">
  <div class="split">
    <aside class="split__side" data-side="api"></aside>

    <!-- 背景：任务列表（与 api-schedules 同构，仅作弹窗背景） -->
    <div class="split__main">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">定时任务</h1>
        </div>
        <div class="page-head__actions">
          <button class="btn btn--primary" id="btn-create"><span data-icon="plus"></span>新建任务</button>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="toolbar__filters">
            <select class="select" id="filter-type" style="width:140px" aria-label="任务类型">
              <option value="">任务类型</option>
              <option value="scene_execute">测试计划</option>
              <option value="import_swagger">接口同步</option>
            </select>
          </div>
          <span class="toolbar__count" id="task-count"></span>
        </div>
        <div class="table-wrap" id="task-table-wrap">
          <table class="table">
            <thead>
              <tr><th style="min-width:180px">任务名称</th><th style="width:120px">任务类型</th><th style="min-width:150px">执行目标</th><th style="width:140px">调度表达式</th><th style="width:90px">启用状态</th><th style="width:220px">操作</th></tr>
            </thead>
            <tbody id="task-tbody"></tbody>
          </table>
        </div>
        <div class="state-block" id="list-empty" hidden>
          <div class="state-block__title" id="empty-title">暂无定时任务</div>
          <div class="state-block__desc" id="empty-desc">还没有定时任务，点击下方按钮新建</div>
          <div class="state-block__action">
            <button class="btn btn--primary" type="button" id="btn-empty-create"><span data-icon="plus"></span>新建任务</button>
            <button class="btn btn--default" type="button" id="btn-empty-reset" hidden>重置筛选</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- 新建/编辑定时任务弹窗（对照 SchedulesPage.vue：el-dialog width="640px" destroy-on-close） -->
<div class="dialog-mask" id="dlg-mask">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="dialog__header">
      <span class="dialog__title" id="dlg-title">新建定时任务</span>
      <a class="dialog__close" href="#" id="dlg-close" title="关闭" aria-label="关闭"><span data-icon="x"></span></a>
    </div>
    <div class="dialog__body">
      <div class="schedule-form" id="schedule-form">
        <div class="field">
          <label class="field__label is-required" for="task-name">任务名称</label>
          <div class="field__content">
            <input class="input" id="task-name" style="width:100%" placeholder="请输入任务名称" maxlength="100">
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="task-desc">任务描述</label>
          <div class="field__content">
            <textarea class="textarea" style="width:100%" rows="2" placeholder="可选" maxlength="500" id="task-desc"></textarea>
          </div>
        </div>

        <div class="field">
          <label class="field__label is-required">任务类型</label>
          <div class="field__content">
            <div class="radio-group" id="tasktype-group" role="radiogroup" aria-label="任务类型">
              <span class="radio-line is-active" data-tasktype="scene_execute" role="radio" aria-checked="true"><span class="radio-dot"></span>测试计划</span>
              <span class="radio-line" data-tasktype="import_swagger" role="radio" aria-checked="false"><span class="radio-dot"></span>接口同步</span>
            </div>
          </div>
        </div>

        <!-- 测试计划任务：执行方式 → 选择模块/场景 → 目标环境（与实际表单 v-if 分支一致） -->
        <div id="plan-fields">
          <div class="field">
            <label class="field__label is-required">执行方式</label>
            <div class="field__content">
              <div class="radio-group" id="scope-group" role="radiogroup" aria-label="执行方式">
                <span class="radio-line is-active" data-scope="all" role="radio" aria-checked="true"><span class="radio-dot"></span>全部</span>
                <span class="radio-line" data-scope="modules" role="radio" aria-checked="false"><span class="radio-dot"></span>指定模块</span>
                <span class="radio-line" data-scope="scenes" role="radio" aria-checked="false"><span class="radio-dot"></span>指定场景</span>
              </div>
            </div>
          </div>

          <div class="field" id="row-modules" hidden>
            <label class="field__label is-required">选择模块</label>
            <div class="field__content">
              <div class="mod-tree" id="mod-tree"></div>
            </div>
          </div>

          <div class="field" id="row-scenes" hidden>
            <label class="field__label is-required">选择场景</label>
            <div class="field__content">
              <div class="scene-tags" id="scene-tags">
                <button class="btn btn--default btn--sm" type="button" id="btn-pick-scene">选择场景</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field__label is-required" for="env-select">目标环境</label>
            <div class="field__content">
              <select class="select" style="width:100%" id="env-select">
                <option value="">请选择执行环境</option>
                <option value="env-1">测试环境</option>
                <option value="env-2">预发环境</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 接口同步任务 -->
        <div class="field" id="row-openapi" hidden>
          <label class="field__label is-required" for="openapi-url">文档地址</label>
          <div class="field__content">
            <input class="input" style="width:100%" id="openapi-url" placeholder="请输入 Swagger/OpenAPI 文档 URL">
          </div>
        </div>

        <div class="field">
          <label class="field__label is-required">调度策略</label>
          <div class="field__content">
            <div class="cron-field">
              <select class="select select--preset" id="preset-select" aria-label="预设">
                <option value="">预设</option>
                <option value="0 * * * *">每小时</option>
                <option value="0 2 * * *">每天凌晨 2:00</option>
                <option value="0 2 * * 1">每周一 2:00</option>
                <option value="0 2 1 * *">每月 1 号 2:00</option>
                <option value="0 2 * * 1-5">工作日 2:00</option>
              </select>
              <input class="input input--cron" id="cron-input" placeholder="Cron 表达式">
              <button class="btn btn--default" type="button" id="btn-check">校验</button>
              <button class="btn btn--default" type="button" id="btn-builder">构建</button>
            </div>
            <div class="cron-validation" id="cron-validation" hidden></div>
            <div class="cron-builder" id="cron-builder" hidden>
              <input class="input" id="b-minute" value="0" placeholder="分" aria-label="分钟">
              <input class="input" id="b-hour" value="2" placeholder="时" aria-label="小时">
              <input class="input" id="b-day" value="*" placeholder="日" aria-label="日">
              <input class="input" id="b-month" value="*" placeholder="月" aria-label="月">
              <input class="input" id="b-weekday" value="*" placeholder="周" aria-label="星期">
              <button class="btn btn--default" type="button" id="btn-apply">应用</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="field__label">启用状态</label>
          <div class="field__content">
            <div class="switch-row">
              <button type="button" class="switch is-on" id="enabled-switch" role="switch" aria-checked="true" aria-label="启用状态"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="dialog__footer">
      <button class="btn btn--default" type="button" id="btn-cancel">取消</button>
      <button class="btn btn--primary" type="button" id="btn-save">保存</button>
    </div>
  </div>
</div>

<!-- 场景选择弹窗：真实多选 + 搜索 + 回填 -->
<div class="dialog-mask" id="picker-mask" hidden>
  <div class="dialog" style="width:480px" role="dialog" aria-modal="true" aria-label="选择场景">
    <div class="dialog__header">
      <span class="dialog__title">选择场景</span>
      <a class="dialog__close" href="#" id="picker-close" title="关闭" aria-label="关闭"><span data-icon="x"></span></a>
    </div>
    <div class="dialog__body">
      <input class="input" id="picker-search" style="width:100%;margin-bottom:10px" placeholder="搜索场景名称" aria-label="搜索场景名称">
      <span class="picker-count" id="picker-count">已选 0 个</span>
      <div class="mod-tree" id="picker-list"></div>
    </div>
    <div class="dialog__footer">
      <button class="btn btn--default" type="button" id="btn-picker-cancel">取消</button>
      <button class="btn btn--primary" type="button" id="btn-picker-confirm">确定</button>
    </div>
  </div>
</div>

<!-- 通用确认框：立即执行 / 删除 -->
<div class="dialog-mask" id="confirm-mask" hidden>
  <div class="dialog" style="width:420px" role="dialog" aria-modal="true" aria-label="确认操作">
    <div class="dialog__header">
      <span class="dialog__title" id="confirm-title">确认操作</span>
      <a class="dialog__close" href="#" id="confirm-close" title="关闭" aria-label="关闭"><span data-icon="x"></span></a>
    </div>
    <div class="dialog__body"><p id="confirm-body" style="margin:0;color:var(--n-700)"></p></div>
    <div class="dialog__footer">
      <button class="btn btn--default" type="button" id="confirm-cancel">取消</button>
      <button class="btn btn--primary" type="button" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- 执行记录抽屉 -->
<div class="rt-exec-mask" id="exec-mask" hidden></div>
<aside class="rt-exec-drawer" id="exec-drawer" aria-label="执行记录" hidden>
  <div class="rt-exec-drawer__head">
    <span class="rt-exec-drawer__title" id="exec-title">执行记录</span>
    <button class="rt-exec-drawer__close" type="button" id="exec-close" aria-label="关闭">×</button>
  </div>
  <div class="rt-exec-drawer__body">
    <table class="table">
      <thead>
        <tr><th style="width:90px">触发方式</th><th style="width:90px">状态</th><th style="width:170px">开始时间</th><th style="width:90px">耗时</th><th style="min-width:140px">结果</th></tr>
      </thead>
      <tbody id="exec-tbody"></tbody>
    </table>
  </div>
  <div class="rt-exec-drawer__foot">共 <span id="exec-total">0</span> 条执行记录</div>
</aside>

<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/ux.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var mask = $('dlg-mask');
  var tbody = $('task-tbody');
  var filterType = $('filter-type');
  var countEl = $('task-count');
  var emptyBox = $('list-empty');
  var emptyDesc = $('empty-desc');
  var emptyReset = $('btn-empty-reset');

  var editingId = null;
  var taskType = 'scene_execute';
  var scope = 'all';
  var enabled = true;
  var sceneTagsExpanded = false;
  var MAX_VISIBLE_SCENE_TAGS = 8;
  var SEED_SCENES = ['下单成功主链路', '支付回调重放', '库存扣减并发', '退款审批流转', '优惠券叠加核销', '登录鉴权流程', '购物车结算', '订单超时关闭', '物流轨迹查询', '发票开具申请'];
  var scenes = SEED_SCENES.slice();

  var MOD_TREE = {
    '订单中心': ['订单创建', '订单查询', '订单取消'],
    '支付中心': ['支付下单', '支付回调', '退款处理'],
    '用户中心': ['用户登录', '注册认证']
  };

  // 本页全部数据只存活于当前 DOM 生命周期，刷新即恢复 demo 初始数据
  var tasks = [
    { id: 'task-1', name: '支付回归夜跑', desc: '每晚全量回归支付链路', type: 'scene_execute', scope: 'all', modules: [], scenes: [], env: 'env-1', openapi: '', cron: '0 2 * * *', enabled: true, lastStatus: null, lastAt: '' },
    { id: 'task-2', name: '核心链路冒烟', desc: '', type: 'scene_execute', scope: 'modules', modules: ['订单创建', '订单查询', '订单取消'], scenes: [], env: 'env-1', openapi: '', cron: '0 * * * *', enabled: true, lastStatus: null, lastAt: '' },
    { id: 'task-3', name: 'Swagger 文档同步', desc: '每周一同步网关最新接口定义', type: 'import_swagger', scope: 'all', modules: [], scenes: [], env: '', openapi: 'https://gateway.demo.cn/v3/api-docs', cron: '0 2 * * 1', enabled: true, lastStatus: null, lastAt: '' }
  ];
  var execRecords = {
    'task-1': [
      { trigger: 'scheduled', status: 'success', startedAt: '2026-11-23 02:00:03', durationMs: 248600, result: '报告: rpt-001' },
      { trigger: 'manual', status: 'success', startedAt: '2026-11-22 15:12:40', durationMs: 196200, result: '报告: rpt-002' }
    ],
    'task-2': [
      { trigger: 'scheduled', status: 'success', startedAt: '2026-11-24 01:00:01', durationMs: 58300, result: '报告: rpt-011' }
    ],
    'task-3': [
      { trigger: 'scheduled', status: 'failed', startedAt: '2026-11-23 02:00:01', durationMs: 10200, error: '连接 api-docs 超时（10s）' }
    ]
  };
  var nextTaskId = 4;

  function toast(msg, type) {
    if (window.RTUX && window.RTUX.toast) window.RTUX.toast(msg, type ? { type: type } : {});
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function nowText() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function isPlanTask() { return taskType === 'scene_execute'; }

  function findTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) return tasks[i];
    }
    return null;
  }

  function typeLabel(type) { return type === 'import_swagger' ? '接口同步' : '测试计划'; }

  function targetLabel(t) {
    if (t.type === 'import_swagger') return t.openapi;
    if (t.scope === 'modules') return '指定模块×' + t.modules.length;
    if (t.scope === 'scenes') return '指定场景×' + t.scenes.length;
    return '全部场景';
  }

  /* ==================== 背景任务列表（真实本地数据） ==================== */
  function renderList() {
    var type = filterType.value;
    var visible = tasks.filter(function (t) { return !type || t.type === type; });
    countEl.textContent = '共 ' + tasks.length + ' 个任务' + (type ? ' · 当前 ' + visible.length : '');
    tbody.innerHTML = visible.map(function (t) {
      var target = targetLabel(t);
      var runText = '';
      if (t.lastStatus) {
        runText = '上次执行：' + (t.lastStatus === 'running' ? '执行中…' : (t.lastStatus === 'success' ? '成功' : '失败')) +
          (t.lastStatus === 'running' ? '' : ' · ' + t.lastAt);
      }
      var targetStyle = t.type === 'import_swagger'

  function syncParent(parent) {
    var nodes = $('mod-tree').querySelectorAll('[data-of="' + parent + '"] .checkbox');
    var allOn = nodes.length > 0;
    nodes.forEach(function (c) { if (!c.classList.contains('checkbox--on')) allOn = false; });
    var pNode = $('mod-tree').querySelector('[data-parent="' + parent + '"] .checkbox');

  function bindModuleNodes() {
    $('mod-tree').querySelectorAll('.mod-node').forEach(function (node) {
      node.addEventListener('click', function () {
        var box = node.querySelector('.checkbox');

        if (parent) {
          $('mod-tree').querySelectorAll('[data-of="' + parent + '"] .checkbox').forEach(function (c) { c.classList.toggle('checkbox--on', on); });
          box.classList.toggle('checkbox--on', on);
        } else {
          box.classList.toggle('checkbox--on', on);
          syncParent(node.getAttribute('data-of'));
        }
        var ph = $('mod-tree').querySelector('.mod-placeholder');
        if (ph) ph.hidden = !!$('mod-tree').querySelector('.checkbox--on');

  /* ==================== Cron ==================== */
  var cronValidation = $('cron-validation');
  var cronInput = $('cron-input');
  var cronBuilderEl = $('cron-builder');
  var RANGES = [[0, 59], [0, 23], [1, 31], [1, 12], [0, 7]];

  function parseField(text, min, max) {
    if (text === '*') return { ok: true, values: null };
    var out = [];
    var ok = text.split(',').every(function (part) {
      var m = part.match(/^(\d+)(?:-(\d+))?$/);
      if (!m) return false;
      var from = parseInt(m[1], 10);
      var to = m[2] ? parseInt(m[2], 10) : from;
      if (from < min || to > max || from > to) return false;
      for (var v = from; v <= to; v++) out.push(v);
      return true;
    });
    return { ok: ok && out.length > 0, values: out.length ? out : null };
  }

  function describe(f) {
    var min = f[0], hr = f[1], dom = f[2], mon = f[3], dow = f[4];
    var time = (hr ? hr.map(function (h) { return pad(h); }).join(',') : '每小时') + ':' + (min ? min.map(function (m) { return pad(m); }).join(',') : '00');
    if (!hr && !dom && !mon && !dow) return '每分钟执行';
    if (hr && !dom && !mon && !dow) return hr.length === 1 && min && min.length === 1 ? '每天 ' + time + ':00 执行' : '每天 ' + time + ' 执行';
    if (dow && !dom) {
      var names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var label = dow.length === 5 && dow.join() === '1,2,3,4,5' ? '周一至周五' : dow.map(function (d) { return names[d] || d; }).join('、');
      return '每' + label + ' ' + time + ' 执行';
    }
    if (dom && !dow) return '每月 ' + dom.join('、') + ' 日 ' + time + ' 执行';
    return '按 ' + cronInput.value + ' 调度';
  }

  function nextRuns(f, count) {
    var results = [];
    var base = new Date();
    base.setSeconds(0, 0);
    for (var d = 0; d < 400 && results.length < count; d++) {
      var day = new Date(base.getTime() + d * 86400000);
      if (f[3] && f[3].indexOf(day.getMonth() + 1) < 0) continue;
      var domHit = f[2] && f[2].indexOf(day.getDate()) >= 0;
      var dowHit = f[4] && f[4].indexOf(day.getDay()) >= 0;
      if (f[2] && f[4] ? !(domHit || dowHit) : (f[2] && !domHit) || (f[4] && !dowHit)) continue;
      for (var h = 0; h < 24 && results.length < count; h++) {
        if (f[1] && f[1].indexOf(h) < 0) continue;
        for (var mi = 0; mi < 60 && results.length < count; mi++) {
          if (f[0] && f[0].indexOf(mi) < 0) continue;
          var t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mi, 0, 0);
          if (t.getTime() <= base.getTime()) continue;
          results.push(t);
        }
      }
    }
    return results;
  }

  function renderCronValidation(valid, description, nextExecutions) {
    cronValidation.hidden = false;
    cronValidation.className = 'cron-validation' + (valid ? '' : ' is-invalid');
    if (!valid) {
      cronValidation.innerHTML = '<span class="text-danger">Cron 表达式无效</span>';
      return;
    }
    var html = '<span>' + description + '</span>';
    if (nextExecutions && nextExecutions.length) {
      html += '<ul class="cron-next">' + nextExecutions.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
    }
    cronValidation.innerHTML = html;
  }

  function validateCron() {
    var raw = cronInput.value.trim();
    if (!raw) {
      cronValidation.hidden = true;
      return false;
    }
    var parts = raw.split(/\s+/);
    var fields = [];
    var valid = parts.length === 5;
    if (valid) {
      for (var i = 0; i < 5; i++) {
        var parsed = parseField(parts[i], RANGES[i][0], RANGES[i][1]);
        if (!parsed.ok) { valid = false; break; }
        fields.push(parsed.values);
      }
    }
    if (!valid) {
      renderCronValidation(false);
      return false;
    }
    var runs = nextRuns(fields, 3).map(function (t) {
      return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()) + ' ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':00';
    });
    renderCronValidation(true, describe(fields), runs);
    return true;
  }

  /* ==================== 保存：真实写入本地数组并重绘列表 ==================== */
  $('btn-save').addEventListener('click', function () {
    var btn = this;
    if (btn.classList.contains('is-saving')) return;
    if (!$('task-name').value.trim()) { toast('请输入任务名称', 'warning'); return; }
    if (!cronInput.value.trim()) { toast('请输入 Cron 表达式', 'warning'); return; }
    if (isPlanTask()) {
      if (!$('env-select').value) { toast('测试计划任务需选择目标环境', 'warning'); return; }
      if (scope === 'modules' && !pickedModules().length) { toast('请选择执行模块', 'warning'); return; }
      if (scope === 'scenes' && !scenes.length) { toast('请选择执行场景', 'warning'); return; }
    } else if (!$('openapi-url').value.trim()) {
      toast('接口同步任务需填写接口文档 URL', 'warning');
      return;
    }
    if (cronInput.value.trim() && cronValidation.hidden) {
      if (!validateCron()) { toast('保存失败：Cron 表达式无效', 'danger'); return; }
    } else if (!cronValidation.hidden && cronValidation.classList.contains('is-invalid')) {
      toast('保存失败：Cron 表达式无效', 'danger');
      return;
    }

    var payload = {
      name: $('task-name').value.trim(),
      desc: $('task-desc').value.trim(),
      type: taskType,
      scope: scope,
      modules: pickedModules(),
      scenes: scenes.slice(),
      env: $('env-select').value,
      openapi: $('openapi-url').value.trim(),
      cron: cronInput.value.trim(),
      enabled: enabled
    };
    var wasEditing = !!editingId;

    btn.classList.add('is-saving');
    btn.disabled = true;
    btn.textContent = '保存中…';
    window.setTimeout(function () {
      btn.classList.remove('is-saving');
      btn.disabled = false;
      btn.textContent = '保存';
      if (wasEditing) {
        var t = findTask(editingId);
        if (t) Object.keys(payload).forEach(function (k) { t[k] = payload[k]; });
      } else {
        var created = { id: 'task-' + nextTaskId++, lastStatus: null, lastAt: '' };
        Object.keys(payload).forEach(function (k) { created[k] = payload[k]; });
        tasks.push(created);
        execRecords[created.id] = [];
      }
      filterType.value = '';
      renderList();
      mask.hidden = true;
      toast(wasEditing ? '已更新任务' : '已创建任务', 'success');
    }, 500);
  });

  /* ==================== 弹窗开关 ==================== */
  function setTaskTypeRadio(type) {
    taskType = type;
    document.querySelectorAll('#tasktype-group .radio-line').forEach(function (r) {
      var disabled = !!editingId;
      r.classList.toggle('is-disabled', disabled);
      r.setAttribute('aria-disabled', disabled ? 'true' : 'false');
    });
  }

  function openCreate() {
    editingId = null;
    $('dlg-title').textContent = '新建定时任务';
    $('task-name').value = '';
    $('task-desc').value = '';
    taskType = 'scene_execute';
    scope = 'all';
    enabled = true;
    $('env-select').value = '';
    $('openapi-url').value = '';
    cronInput.value = '';
    $('preset-select').value = '';
    cronBuilderEl.hidden = true;
    $('btn-builder').textContent = '构建';
    cronValidation.hidden = true;
    cronValidation.innerHTML = '';
    clearModules();
    scenes = SEED_SCENES.slice();
    sceneTagsExpanded = false;
    renderScenes();
    setTaskTypeRadio(taskType);
    syncTaskTypeUI();
    syncScopeUI();
    syncEnabledUI();
    mask.hidden = false;
  }

  function openEdit(t) {
    editingId = t.id;
    $('dlg-title').textContent = '编辑定时任务';
    $('task-name').value = t.name || '';
    $('task-desc').value = t.desc || '';
    taskType = t.type || 'scene_execute';
    scope = t.scope || 'all';
    enabled = t.enabled !== false;
    $('env-select').value = t.env || '';
    $('openapi-url').value = t.openapi || '';
    cronInput.value = t.cron || '';
    $('preset-select').value = '';
    cronBuilderEl.hidden = true;
    $('btn-builder').textContent = '构建';
    cronValidation.hidden = true;
    cronValidation.innerHTML = '';
    setModules(t.modules || []);
    scenes = scope === 'scenes'
      ? ((t.scenes && t.scenes.length ? t.scenes : SEED_SCENES.slice(0, 3)).slice())
      : SEED_SCENES.slice();
    sceneTagsExpanded = false;
    renderScenes();
    setTaskTypeRadio(taskType);
    syncTaskTypeUI();
    syncScopeUI();
    syncEnabledUI();
    mask.hidden = false;
  }

  function closeDialog(e) {
    if (e) e.preventDefault();
    mask.hidden = true;
  }

  $('btn-create').addEventListener('click', openCreate);
  $('dlg-close').addEventListener('click', closeDialog);
  $('btn-cancel').addEventListener('click', closeDialog);
  mask.addEventListener('click', function (e) { if (e.target === mask) closeDialog(); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!pickerMask.hidden) { closeScenePicker(); return; }
    if (!confirmMask.hidden) { closeConfirm(); return; }
    if (!execDrawer.hidden) { closeExecDrawer(); return; }
    if (!mask.hidden) closeDialog();
  });

  renderModules();
  renderScenes();
  syncTaskTypeUI();
  syncScopeUI();
  syncEnabledUI();
  renderList();
</script>
</body>
</html>
