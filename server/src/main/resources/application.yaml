server:
  port: ${PORT:58080}

spring:
  application:
    name: robotest-server
  lifecycle:
    timeout-per-shutdown-phase: 60s
  threads:
    virtual:
      enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  config:
    import: optional:classpath:.env[.properties]
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/robotest?stringtype=unspecified}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      user: default
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

#################### 业务自定义配置 ####################
#
robotest:
  upload:
    dir: ${UPLOAD_DIR:./uploads/bug}
  ai:
    # AI 服务密钥加密密钥（Base64 编码 32 字节），未配置时 AI 能力视为未启用
    secret-key: ${AI_SECRET_KEY:4chJwgVabFLPyA0Mty7RDhu7lXR5Hik2QZ0FJjS3rtI=}
  env:
    # 环境敏感变量加密密钥（Base64 编码 32 字节），与 AI 密钥独立，支持单独轮换
    secret-key: ${ENV_SECRET_KEY:4chJwgVabFLPyA0Mty7RDhu7lXR5Hik2QZ0FJjS3rtI=}
  api-test:
    mock:
      # Mock 免登录访问总开关（Mock服务详细设计 6.1），关闭后仅保留管理端 CRUD
      access-enabled: ${MOCK_ACCESS_ENABLED:true}
      # 独立监听端口（与 base-url 保持一致）；置空则复用主端口并按 excluded-prefixes 排除业务路由
      port: ${MOCK_PORT:18080}
      # 对外可访问基础地址，用于控制台展示 Mock URL；留空按端口推导
      base-url: ${MOCK_BASE_URL:http://localhost:18080}
      # 单路径限流（次/秒），超限返回 429
      path-qps: ${MOCK_PATH_QPS:50}
      # 主端口复用模式下的业务前缀排除清单
      excluded-prefixes: /api,/ws,/index.html,/assets
    scheduler:
      # 定时任务调度线程池大小（定时任务详细设计 4.1）
      pool-size: ${SCHEDULER_POOL_SIZE:2}
      # 场景执行结果轮询等待上限（分钟），超时按 failed 留痕
      execution-timeout-minutes: ${TASK_EXECUTION_TIMEOUT_MINUTES:30}
      # 执行状态轮询间隔（毫秒）
      poll-interval-ms: ${TASK_POLL_INTERVAL_MS:5000}
#################### 框架相关配置 ####################

migoo:
  debug: ${DEBUG_STATUS:false}
  xss:
    enable: true
  websocket:
    enabled: true
    distributed: true
    endpoints:
      - /ws/documents/*
    token-header: Authorization
    token-prefix: "Bearer "
    max-session-timeout: 1800000
  security:
    mode: jwt
    jwt:
      secret-key: ${JWT_SECRET_KEY:9aef92670f10242388d55d2ffc0eeb43}
      access-token-expires: PT1M
      refresh-token-expires: P7D
      header-name: Authorization
      refresh-header-name: X-Refresh-Token
    password-secret: ${PASSWORD_SECRET:17c553e34228909b1f8cef6d1de0b53d}
    logout-url: /api/auth/logout
    permit-all-urls:
      - /api/auth/login
      - /api/auth/logout
      # 刷新接口仅信任请求头中的 refresh token，无 access token，必须匿名可达（migoo-framework 6.5）
      - /api/auth/refresh
      - /api/auth/init/**
      - /api/workspace/invitations/verify
      - /api/workspace/invitations/check-email
      - /api/workspace/invitations/join
      # 报告分享免登录访问（基础设施详细设计 3.4.4），鉴权依赖一次性 token
      - /api/public/api-reports/**
      - /ws/**
      - /debug/**
      # 合并部署（方案B）：SPA 页面壳与静态资源需匿名访问，数据接口仍由 /api 鉴权保护
      - /
      - /index.html
      - /favicon.ico
      - /assets/**
      - /login
      - /init
      - /join
      - /admin/**
      - /workspaces
      - /workspace/**

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: false
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:mapper/*.xml


