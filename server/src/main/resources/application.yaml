server:
  port: ${PORT:8080}

spring:
  application:
    name: robotest-server
  lifecycle:
    timeout-per-shutdown-phase: 60s
  threads:
    virtual:
      enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  config:
    import: optional:classpath:.env[.properties]
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/robotest?stringtype=unspecified}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      user: default
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

#################### 框架相关配置 ####################

migoo:
  debug: ${DEBUG_STATUS:false}
  xss:
    enable: true
  websocket:
    enabled: true
    distributed: true
    endpoints:
      - /ws/documents/*
    token-header: Authorization
    token-prefix: "Bearer "
    max-session-timeout: 1800000
  security:
    mode: jwt
    jwt:
      secret-key: ${JWT_SECRET_KEY:9aef92670f10242388d55d2ffc0eeb43}
      access-token-expires: PT24H
      refresh-token-expires: P7D
      header-name: Authorization
      refresh-header-name: X-Refresh-Token
    password-secret: ${PASSWORD_SECRET:17c553e34228909b1f8cef6d1de0b53d}
    logout-url: /api/auth/logout
    permit-all-urls:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/init/**
      - /api/workspace/invitations/verify
      - /api/workspace/invitations/check-email
      - /api/workspace/invitations/join
      - /ws/**
      - /debug/**
      # 合并部署（方案B）：SPA 页面壳与静态资源需匿名访问，数据接口仍由 /api 鉴权保护
      - /
      - /index.html
      - /favicon.ico
      - /assets/**
      - /login
      - /init
      - /join
      - /admin/**
      - /workspaces
      - /workspace/**

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: false
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:mapper/*.xml

# 业务自定义配置
robotest:
  upload:
    dir: ${UPLOAD_DIR:./uploads/bug}
