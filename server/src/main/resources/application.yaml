server:
  port: ${PORT:58080}

spring:
  application:
    name: robotest-server
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 60s
  threads:
    virtual:
      enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  config:
    import: optional:file:.env[.properties],optional:classpath:.env[.properties]
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      # 文件管理模块级上限 20MB（SRS 导入详设 3.8）；缺陷附件 10MB 由业务层继续强制（文件管理详设 5.2）
      max-file-size: 20MB
      # 预留 multipart 边界开销，恰好 20MB 的文件不因请求体超限被拒
      max-request-size: 21MB
  datasource:
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      user: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

#################### 业务自定义配置 ####################
#
robotest:
  upload:
    dir: ${UPLOAD_DIR:./uploads/bug}
  s3:
    # 对象存储（文件管理详设 3.1）：dev 默认直连本机 compose 发布的 SeaweedFS；prod 必须显式配置凭据
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # presigned 签名地址（浏览器可达）；留空同 endpoint——compose 中服务内部网地址浏览器无法直连，须配宿主发布地址
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:robotest}
    secret-key: ${S3_SECRET_KEY:robotest-dev-secret}
    bucket: ${S3_BUCKET:robotest}
    presign-ttl-seconds: ${S3_PRESIGN_TTL:900}
  env:
    # 环境敏感变量加密密钥（Base64 编码 32 字节），生产环境必须显式配置
    secret-key: ${ENV_SECRET_KEY}
  api-test:
    import:
      # Swagger URL 拉取安全策略（接口管理详细设计 4.3）：strict（默认，公网/云上部署，禁内网地址）或 intranet（内网测试环境，放行内网地址但仅允许 swagger 文档路径）
      url-policy: ${IMPORT_URL_POLICY:intranet}
      # strict 策略的显式端口白名单（安全规范 6.3 端口校验）；intranet 策略放行合法端口但仅限 swagger 文档路径
      allowed-ports: ${IMPORT_ALLOWED_PORTS:80,443,8080,8443}
    mock:
      # Mock 免登录访问总开关（Mock服务详细设计 6.1），关闭后仅保留管理端 CRUD
      access-enabled: ${MOCK_ACCESS_ENABLED:true}
      # 独立监听端口（与 base-url 保持一致）；置空则复用主端口并按 excluded-prefixes 排除业务路由
      port: ${MOCK_PORT:18080}
      # 对外可访问基础地址，用于控制台展示 Mock URL；留空按端口推导
      base-url: ${MOCK_BASE_URL:http://localhost:18080}
      # 单路径限流（次/秒），超限返回 429
      path-qps: ${MOCK_PATH_QPS:50}
      # 主端口复用模式下的业务前缀排除清单
      excluded-prefixes: /api,/ws,/index.html,/assets
    scheduler:
      # 定时任务调度线程池大小（定时任务详细设计 4.1）
      pool-size: ${SCHEDULER_POOL_SIZE:2}
      # 场景执行结果轮询等待上限（分钟），超时按 failed 留痕
      execution-timeout-minutes: ${TASK_EXECUTION_TIMEOUT_MINUTES:30}
      # 执行状态轮询间隔（毫秒）
      poll-interval-ms: ${TASK_POLL_INTERVAL_MS:5000}
#################### 框架相关配置 ####################

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

migoo:
  debug: ${DEBUG_STATUS:false}
  xss:
    enable: true
  websocket:
    enabled: true
    distributed: true
    endpoints:
      - /ws/documents/*
    token-header: Authorization
    token-prefix: "Bearer "
    max-session-timeout: 1800000
  security:
    mode: jwt
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expires: PT24H
      refresh-token-expires: P7D
      header-name: Authorization
      refresh-header-name: X-Refresh-Token
    password-secret: ${PASSWORD_SECRET}
    # 框架 LogoutFilter 只撤销 Authorization 中的 access token，业务登出走 POST /api/auth/logout（认证详细设计 5.1）
    logout-url: /logout
    # 登录失败锁定（安全规范 6.1）：超限返回框架全局错误码 423
    login-lock:
      enabled: true
      # 连续失败计数空闲清零窗口
      failure-window: PT30M
      fixed:
        enabled: true
        threshold: 5
        duration: PT10M
      sliding-window:
        enabled: true
        threshold: 5
        window: PT15M
        duration: PT10M
    permit-all-urls:
      - /api/auth/login
      - /api/auth/logout
      # 刷新接口仅信任请求头中的 refresh token，无 access token，必须匿名可达（migoo-framework 6.5）
      - /api/auth/refresh
      - /api/auth/init/**
      - /api/workspace/invitations/verify
      - /api/workspace/invitations/check-email
      - /api/workspace/invitations/join
      # 报告分享免登录访问（基础设施详细设计 3.4.4），鉴权依赖一次性 token
      - /api/public/api-reports/**
      - /ws/**
      - /debug/**
      - /v3/api-docs/**
      # 合并部署（方案B）：SPA 页面壳与静态资源需匿名访问，数据接口仍由 /api 鉴权保护
      - /
      - /index.html
      - /favicon.ico
      - /assets/**
      - /login
      - /init
      - /join
      - /admin/**
      - /workspaces
      - /workspace/**

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志按环境显式声明（安全规范 6.4）：dev=StdOutImpl、prod=NoLoggingImpl；基座不输出 SQL 参数
    lazy-loading-enabled: false
  global-config:
    db-config:
      id-type: input
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:mapper/*.xml


